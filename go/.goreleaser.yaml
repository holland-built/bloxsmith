# goreleaser config for Bloxsmith — the Go single-binary distribution layer.
#
# Lives in go/ because the module (go.mod) and the //go:embed'd frontend
# (go/web/) both live here. Run every command from this directory:
#   goreleaser build   --snapshot --clean   # local cross-compile test, NO publish
#   goreleaser release --clean               # real: archives + checksums + Release
#                                            #       + Homebrew + ghcr image
#
# Version: goreleaser derives {{ .Version }} from the pushed git tag. Tags are
# semver `vX.Y.Z` (SHIP.md; e.g. v2.2.0), so {{ .Version }} == `X.Y.Z` — exactly
# what update.go's verN() compares against the GitHub Releases API. The ldflags
# `-X main.version=` below REPLACES the old Dockerfile `APP_VERSION` ARG.
#
# The frontend needs no staging step: go/web/ is committed, so `go:embed all:web`
# bakes the UI into every cross-compiled binary from a clean checkout.
version: 2

project_name: bloxsmith

before:
  hooks:
    - go mod tidy
    # Embeds standard Windows version-info resources (ProductName, FileVersion,
    # CompanyName, ...) into the .exe — good hygiene regardless of code signing.
    # goreleaser does not embed Windows version resources itself —
    # goversioninfo compiles versioninfo.json into resource_windows_amd64.syso,
    # which `go build` auto-links for the windows/amd64 target below (see
    # versioninfo.go).
    # Installed fresh each run (not vendored) — needs network in CI.
    - go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
    # `go generate` filters files by the HOST's build tags, not the target's —
    # on a linux/macOS CI runner it silently skips versioninfo.go's `windows`
    # build tag unless GOOS is forced here (verified: omitting this produces
    # no .syso and the release ships unsigned-metadata Windows binaries).
    - sh -c "GOOS=windows GOARCH=amd64 go generate ./..."
    # Write the static version file the updater reads instead of GitHub's REST
    # API (go/versionfile.go). Fetching a release ASSET is a plain download and
    # is NOT subject to the 60-unauthenticated-requests/hour API limit, so
    # `releases/latest/download/version.json` lets any number of installs behind
    # one IP check for updates for free.
    #
    # Generated HERE rather than staged by release.yml (the way install.{sh,ps1}
    # are) for two reasons: the version has to come from goreleaser's own
    # {{ .Version }}, the same value that stamps the binary via ldflags, so the
    # two can never disagree; and it means a local `goreleaser release` produces
    # it too, with no extra manual step to forget. It lands in go/ — goreleaser's
    # cwd — so the extra_files glob below stays a bare filename (see the `../`
    # trap documented there). Gitignored, like the staged installers.
    #
    # NOT SIGNED, and deliberately not part of checksums.txt: it only says a tag
    # exists. See the header comment in go/versionfile.go before adding a field.
    - sh -c "printf '{\"tag\":\"v{{ .Version }}\"}\n' > version.json"

builds:
  - id: bloxsmith
    main: .
    binary: bloxsmith
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - darwin
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      # No windows/arm64 target (Windows audience is amd64).
      - goos: windows
        goarch: arm64

# Merge darwin/amd64 + darwin/arm64 into a single fat macOS binary. `replace`
# drops the two per-arch builds so Homebrew ships one universal artifact.
universal_binaries:
  - id: bloxsmith
    replace: true

archives:
  - id: bloxsmith
    ids:
      - bloxsmith
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS_universal
      {{- else }}{{ .Os }}_{{ .Arch }}{{ end }}
    # Bundle the fetched third-party templates next to the binary: the binary's
    # default TemplatesDir is <binary-dir>/templates, so extracting the archive
    # yields a working template/seed provisioning setup with zero extra steps.
    #
    # LICENSE and NOTICE.md are here because of that word "third-party". Those
    # templates follow the schema of Chris Marrison's BSD-2-Clause
    # uddi_automation_toolkit, and the binary beside them contains a derivative
    # work of it (go/internal/provision — see its package comment). Clause 2 of
    # that licence requires a binary redistribution to reproduce the copyright
    # notice, and every archive before this one shipped without one.
    #
    # Both are staged INTO go/ before the build (CI: the cp step in release.yml;
    # local: do the same by hand), because this list is resolved against
    # goreleaser's cwd and a `../` prefix is rejected by its zglob at publish
    # time — the same reason the installers are staged rather than referenced.
    files:
      - src: templates/**/*
      - src: LICENSE
      - src: NOTICE.md
    format_overrides:
      # Windows ships a zip (install.ps1 / direct download consume it).
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

# --- SBOM (software bill of materials) ----------------------------------------
# Every release up to now was signed but had no ingredients list. Signatures
# answer "did this come from the Bloxsmith pipeline"; they say nothing about
# what is INSIDE. That is the question a corporate security team asks before
# approving an install, and the question asked again the morning a CVE lands in
# a transitive Go module — and until this block existed the only way to answer
# either was to download the archive and run `go version -m` on the binary
# yourself. govulncheck in ci.yml checks the tree we build FROM; an SBOM
# records what actually shipped, which is not the same artifact.
#
# goreleaser does NOT bundle syft — it shells out to it, and if syft is absent
# this pipe fails the release. It is installed by the "Install syft" step in
# release.yml, and (deliberately) also in ci.yml so a broken installer reddens
# a PR instead of a tag.
#
# `artifacts: archive` produces ONE SBOM PER ARCHIVE, named
# <archive>.sbom.json — verified locally 2026-08-06 with goreleaser v2.17.0 +
# syft v1.50.0:
#   bloxsmith_<ver>_linux_amd64.tar.gz.sbom.json      (11 packages, 16 KB)
#   bloxsmith_<ver>_linux_arm64.tar.gz.sbom.json
#   bloxsmith_<ver>_macOS_universal.tar.gz.sbom.json  (both arches, 27 KB)
#   bloxsmith_<ver>_windows_amd64.zip.sbom.json
# Format is syft's default, SPDX 2.3 JSON (NOT CycloneDX — do not write that in
# the docs without changing `args` here first). Contents are the Go module
# graph read back out of the compiled binary: aead.dev/minisign v0.3.0,
# fernet-go, kardianos/service, minio/selfupdate, golang.org/x/*, yaml.v3, and
# the `stdlib` pseudo-package pinning the exact toolchain (go1.26.5 locally).
#
# WHAT THIS BLOCK ALONE DOES NOT COVER — say it plainly rather than let "we ship
# an SBOM" imply more than it does. Both gaps below are now closed elsewhere,
# and where they are closed is named so nobody has to go looking:
#   * The pushed ghcr.io image. goreleaser's sboms pipe runs over release
#     ARTIFACTS (archives), and dockers_v2 builds the image afterwards from the
#     binary; nothing HERE catalogs the image. That is not a goreleaser option
#     that was left off — the pipe has no artifact selector that matches a
#     pushed image, because the image does not exist yet when it runs. It is
#     covered instead by the "SBOM attestation for the pushed ghcr images" step
#     in release.yml, which runs AFTER the push, scans each per-architecture
#     image out of the registry, and attaches the result with `cosign attest`
#     under the same keyless OIDC identity docker_signs below uses.
#   * go/web/ — the embedded UI bundle is a //go:embed'd blob inside the binary,
#     so syft reading the compiled binary cannot see the npm tree behind it and
#     React, recharts and tailwind appear in none of the archive SBOMs above.
#     That is a real supply-chain surface, not a theoretical one: the postcss
#     advisory GHSA-fxqj-rqcc-2cmp was live in that tree and was fixed in
#     d34cee9. Covered by the second sboms entry below, which catalogs the
#     lockfile directly instead of the binary.
#
# The SBOMs ARE in checksums.txt (confirmed: the sbom pipe runs during the
# archive phase, before checksums are calculated), so they inherit the Ed25519
# and sshsig signatures release.yml puts over that file — plus a direct cosign
# signature of their own, below.
sboms:
  - id: archive-sbom
    artifacts: archive

  # --- the embedded UI's npm dependency closure ------------------------------
  # The entry above reads COMPILED BINARIES, and go/web/app.bundle.js is a
  # minified blob embedded in one. syft finds no package.json, no node_modules
  # and no module metadata in it, so every npm package the dashboard is built
  # from was absent from every SBOM this project has ever published. `npm audit`
  # in ci.yml checks that tree against advisories, which is a different question
  # from recording what is in it — an auditor handed the release cannot run
  # `npm audit` against an artifact they do not have the source for.
  #
  # `artifacts: any` is the selector for an SBOM that belongs to the release but
  # is not derived from any one release artifact. It runs the cmd ONCE and adds
  # each `documents:` entry to the artifact list as type SBOM, which is what
  # gets it into checksums.txt and matched by the `artifacts: sbom` signing
  # entry below — verified in a snapshot run, not assumed.
  #
  # THE PATH TRAP: goreleaser runs sbom commands with cwd = dist/, NOT the
  # config's directory. Confirmed by probe (`pwd` from inside this cmd printed
  # <repo>/go/dist). So the lockfile is TWO levels up plus ui/, and a `../ui`
  # that looks right from this file's location silently resolves to go/ui/,
  # which does not exist. `$document` is a bare filename relative to that same
  # dist/.
  #
  # WHAT IT CONTAINS, and equally what it deliberately does not: syft's
  # javascript cataloger has include-dev-dependencies OFF by default, so this is
  # the PRODUCTION dependency closure npm itself computes — the packages whose
  # code can reach the bundle — and not the full devDependencies tree. Measured
  # 2026-08-06, syft v1.50.0: 130 packages production-only vs 152 with
  # SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES=true. The 22 excluded are oxlint
  # and its 19 platform bindings, @types/react-dom, and @vitejs/plugin-react.
  #
  # `vite` and the `@rolldown/*` bindings ARE in the production set even though
  # vite sits in ui/package.json's devDependencies, and that is npm's answer
  # rather than a mistake here: @tailwindcss/vite is a production dependency and
  # peer-depends on vite, so package-lock.json does not mark vite `dev` (checked:
  # `.packages["node_modules/vite"].dev` is false, `oxlint`'s is true). The set
  # is therefore a superset of what literally ends up in app.bundle.js — it also
  # holds build-time tools like tailwindcss reachable from a prod dependency.
  # Superset is the safe direction for a security answer: it over-reports rather
  # than hiding something that shipped.
  #
  # Read it with:
  #   jq -r '.packages[] | "\(.name) \(.versionInfo)"' \
  #     bloxsmith_<ver>_ui_npm.sbom.json | sort
  - id: ui-npm-sbom
    artifacts: any
    documents:
      - "bloxsmith_{{ .Version }}_ui_npm.sbom.json"
    cmd: syft
    args:
      - scan
      - "file:../../ui/package-lock.json"
      # Without these two the SPDX document calls itself "package-lock.json"
      # with no version, which is useless once the file is detached from the
      # release. They also give the image attestation in release.yml a stable
      # `.predicate.name` to filter on when both predicates sit on one digest.
      - "--source-name=bloxsmith-ui-npm"
      - "--source-version={{ .Version }}"
      - "-o"
      - "spdx-json=$document"

# cosign keyless-sign checksums.txt (covers every archive via its sha256 entry).
# Same CI identity/mechanism as docker_signs below. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp '^https://github\.com/holland-built/bloxsmith/\.github/workflows/release\.yml@refs/tags/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
  # Identical cmd/args to the checksum entry above — same keyless CI identity,
  # same verify command, only the artifact selector differs. A separate entry
  # rather than widening the one above to `artifacts: all`, which would also
  # sign every archive and binary and roughly triple the Rekor round trips for
  # coverage checksums.txt already provides.
  #
  # Signing the SBOM directly, even though it is listed in checksums.txt, is the
  # point: an SBOM is the artifact that gets forwarded on its own — pasted into
  # a ticket, uploaded to a vendor portal, mailed to a security reviewer —
  # detached from the release page and from checksums.txt. Verified in that
  # state it proves nothing unless it carries its own signature. Each SBOM gets
  # <name>.sbom.json.sig and .sbom.json.pem. Verify one with:
  #   cosign verify-blob \
  #     --certificate bloxsmith_<ver>_linux_amd64.tar.gz.sbom.json.pem \
  #     --signature   bloxsmith_<ver>_linux_amd64.tar.gz.sbom.json.sig \
  #     --certificate-identity-regexp '^https://github\.com/holland-built/bloxsmith/\.github/workflows/release\.yml@refs/tags/' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
  #     bloxsmith_<ver>_linux_amd64.tar.gz.sbom.json
  #
  # `id:` is REQUIRED here and its absence is a hard error, not a warning:
  # goreleaser defaults every unnamed signs entry to the id `default` and then
  # refuses the config with "found 2 signs with the ID 'default'". The entry
  # above keeps the implicit `default` so nothing that referred to it changes.
  - id: sbom
    cmd: cosign
    artifacts: sbom
    certificate: "${artifact}.pem"
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"

snapshot:
  # Local `--snapshot` builds have no tag on HEAD; stamp a clearly-non-release
  # version so verN() still parses an <n> and /api/update/check shows it.
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  disable: true

release:
  github:
    owner: holland-built
    name: bloxsmith
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  # Attach both installers to every release so
  # releases/latest/download/install.{sh,ps1} always resolve — no manual
  # `gh release upload`. Globs are relative to go/ (goreleaser's cwd). The
  # scripts are staged INTO go/ first (CI: a copy step in release.yml; local:
  # `cp ../scripts/install.{sh,ps1} .`) — a `../` glob here trips goreleaser's
  # zglob at SCM-publish time ("stat static prefix .//<abs>: invalid argument"),
  # which `--snapshot` never exercises, so it only fails on a real release.
  extra_files:
    - glob: install.sh
    - glob: install.ps1
    # Written by the before-hook above, in go/ for the same `../` reason.
    - glob: version.json

# --- Homebrew tap: `brew install holland-built/tap/bloxsmith` -----------------
brews:
  - name: bloxsmith
    ids:
      - bloxsmith
    repository:
      owner: holland-built
      name: homebrew-tap
      branch: main
      # CI: HOMEBREW_TAP_TOKEN (PAT with repo scope on homebrew-tap) — the
      # built-in GITHUB_TOKEN can't push cross-repo. release.yml runs the brew
      # channel only when this secret is set (else --skip=homebrew), so a plain
      # env ref is safe. goreleaser (v2.17+ via goreleaser-action@v7) rejects
      # conditional/if-else token templates — must be {{ .Env.VAR }} only.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/holland-built/bloxsmith"
    description: "Bloxsmith — self-contained Infoblox BloxOne NOC dashboard (embedded UI + API proxy)."
    license: "MIT"
    # Formula lands here in the tap repo.
    directory: Formula
    commit_author:
      name: goreleaser-bot
      email: bot@holland-built.dev
    install: |
      bin.install "bloxsmith"
    test: |
      system "#{bin}/bloxsmith", "--version"
    caveats: |
      Start Bloxsmith by running:  bloxsmith
      Then open the dashboard:     http://localhost:8080
      Run it at login in the background:  bloxsmith service install

# --- Container image for the enterprise-server audience ----------------------
# distroless/static — same env contract as the old python image, so the existing
# docker-compose.yml + noc-vault volume drop in unchanged. Built only during
# `goreleaser release` (skipped by `goreleaser build`).
dockers_v2:
  - ids:
      - bloxsmith
    images:
      - "ghcr.io/holland-built/bloxsmith"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
    # extra_files only puts these in the BUILD CONTEXT. The COPY lines in
    # Dockerfile.goreleaser are what put them in the image — both halves are
    # required, and having only one is a silent no-op.
    extra_files:
      - templates
      - LICENSE
      - NOTICE.md
    labels:
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "https://github.com/holland-built/bloxsmith"

# --- cosign keyless signing of the pushed ghcr images -------------------------
# Runs in CI (release.yml) with id-token: write — the signature's identity is
# the workflow's OIDC identity; no key is stored anywhere. Verify with:
#   cosign verify ghcr.io/holland-built/bloxsmith:<tag> \
#     --certificate-identity-regexp '^https://github\.com/holland-built/bloxsmith/\.github/workflows/release\.yml@refs/tags/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
docker_signs:
  - cmd: cosign
    artifacts: all
    output: true
    args: ["sign", "--yes", "${artifact}@${digest}"]
