# Nothing in this repo told anyone that a dependency moved, until this file.
#
# CI refuses a KNOWN-BAD dependency — govulncheck on the Go module, `npm audit`
# on ui/ — but both only fire once an advisory has been published against a
# version already committed here. Neither says a word about a release that
# simply exists and is newer. (Nor did either fire on a schedule until
# security-scan.yml; ci.yml's triggers are push and pull_request only.)
#
# The worked example this file was written around: aead.dev/minisign had sat on
# v0.2.0 with v0.3.0 out, on the code path that verifies release signatures for
# `bloxsmith update`. That specific drift is CLOSED — go.mod is on v0.3.0. It is
# left here rather than deleted because how it closed is the point:
#
#   - not by Dependabot. It was bumped by hand in 8784ece, the 2026-08-06
#     security audit, along with nine other things a human had to go looking for.
#   - minisign is now `// indirect` and reaches this tree through
#     github.com/minio/selfupdate, so it is Dependabot's default policy NOT to
#     bump it directly. The signature-verification claim above still holds; the
#     route to it changed.
#
# A stale example in the file that argues for dependency hygiene is that argument
# failing in miniature, which is why this is written out rather than quietly
# updated to a fresher version number.
#
# THE GO HALF LOOKED BROKEN AND IS NOT. Through 2026-08-15 the `gomod` block
# below had opened zero pull requests while npm and github-actions had opened
# thirteen between them, and this file recorded that as an undiagnosed symptom
# under issue #40. It was diagnosed on 2026-08-18 from the ecosystem's own job
# history, and #40 is closed as not a bug:
#
#   - the jobs are not failing. The five most recent gomod runs all completed
#     green, each reporting "No PRs affected".
#   - every Go module still behind is `// indirect`, and the gomod updater does
#     not open PRs for indirect dependencies by default. Documented behaviour,
#     not a misconfiguration here.
#   - golang.org/x/crypto, the direct dependency #40 was opened about, reached
#     v0.55.0 on 2026-08-15 in cc298c8 (#62) — by hand, four days before the
#     weekly slot could have found it. A release that lands between two runs and
#     is fixed by a human in between leaves Dependabot nothing to propose. That
#     is the whole of the zero: a cadence that never had a direct bump waiting
#     for it. Note it is the SECOND bump in this file made by a human rather
#     than by this config, after minisign above.
#
# A theory checked and REJECTED, written out so nobody re-derives it: go/go.mod
# declares `go 1.26.6` while Dependabot's go_modules image is built on
# golang:1.26.5, and locally that pair refuses the module under GOTOOLCHAIN=local
# — the same lag that broke every Go job in ci.yml:119-127. It explains the
# symptom cleanly and it is still wrong, because the jobs succeed. Do NOT lower
# the `go` directive on the strength of it; it was raised deliberately for four
# reachable stdlib advisories.
#
# So the count of PRs from this block is not the measure. What it covers is
# DIRECT dependencies only. Watching the indirect ones as well is a deliberate
# config change with a real cost — PRs for packages nothing in this tree calls,
# two of them test-only leftovers last tagged in 2016 and 2018 — and would be
# worth doing on purpose, never to make a counter go up.
#
# Weekly, not daily: this is a small tree with three ecosystems, and daily
# turns a maintenance signal into background noise that gets filtered.
#
# open-pull-requests-limit: 5 is what Dependabot would default to anyway; it
# is written out per ecosystem so the cap is a decision on record rather than
# an inherited default someone later raises without knowing why it mattered.
# The first run will find every dependency that has drifted since the repo was
# written, and 15 open PRs across three ecosystems is already the edge of
# reviewable — an uncapped wall is how this gets switched off in week one.
#
# Directories are per-manifest, and this repo keeps none at the root: the Go
# module is go/go.mod, the web app is ui/package.json, and the workflow files
# are the one thing that genuinely lives at "/".
version: 2
updates:
  # The product. Also the only half that touches Infoblox credentials.
  - package-ecosystem: gomod
    directory: /go
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Build tooling and the embedded UI. A bump here changes go/web, so these
  # PRs need `cd ui && npm run build && rm -rf ../go/web/* && cp -R dist/* ../go/web/`
  # before CI's "UI dist up to date" step will pass — expect red until then.
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The actions in .github/workflows. These are pinned by major tag, so they
  # move underneath us silently and no lockfile records what actually ran.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
