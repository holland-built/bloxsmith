name: MCP drift check

# Infoblox reshuffles the undocumented CSP /mcp surface with no notice
# (e.g. the whole iq-actions_* tool family vanished in a week; separately,
# portal services and analytics cubes have silently added/removed/resized
# entries — Licensing appeared, ThirdPartyProviders vanished, DnsConfig went
# 30->44 paths, cube count went 19->38 — with nothing to catch it). This job
# catalogs the LIVE tools, services, and cubes nightly and, when any of them
# differ from the committed snapshots (scripts/out_tools.json,
# scripts/out_services.json, scripts/out_cubes.json), opens a GitHub issue so
# the maintainer finds out before a tile silently breaks. Maintainer-facing
# only — nothing user-visible.
#
# REQUIRES a repo secret INFOBLOX_API_KEY (a CSP API token). Without it the job
# skips the live catalog and does nothing.
#
# It also has a second, manual-only mode: `refresh_baselines`. Once drift has been
# reviewed and found harmless, the snapshots have to be regenerated — and that needs
# INFOBLOX_API_KEY, which exists ONLY as a repo secret. So the refresh runs here,
# reusing this same catalog, commits the new snapshots to a branch and pushes it,
# then prints the URL that opens the PR. It does NOT open the PR itself — see the
# `refresh` job's permissions block for why. A human still reviews the same diff.
#
# The comparison itself lives in scripts/mcp_diff.py, not in this file, so it can be
# tested. It was inline once and compared names only, which is how 17 cube
# deprecations passed it unseen on 2026-08-14.

on:
  schedule:
    - cron: "17 6 * * *" # ~06:17 UTC nightly
  workflow_dispatch:
    inputs:
      # Default false, and the `inputs` context is empty on a schedule event, so both
      # the nightly cron and an ordinary manual run behave exactly as they always
      # have: catalog, diff, report drift, write nothing.
      refresh_baselines:
        description: "Regenerate the committed snapshots, push them to a branch, and print the PR link (this run will NOT report drift)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    # Read by the `refresh` job: it must not try to refresh from a catalog that never ran.
    outputs:
      catalogued: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Skip if no API key configured
        id: gate
        run: |
          if [ -z "${{ secrets.INFOBLOX_API_KEY }}" ]; then
            # A WARNING, not a silent skip. Skipping is correct for a fork with no
            # key — failing there would be noise nobody can act on. But on the repo
            # that DOES have one, a key that expired or got deleted would otherwise
            # leave this job passing green forever while watching nothing, which is
            # the same dead-check shape as the ImportError that went unnoticed for
            # two nights. A warning shows on the run summary without breaking forks.
            echo "::warning::No INFOBLOX_API_KEY secret — the live MCP catalog was NOT checked. Nothing is watching for drift in this run."
            echo "No INFOBLOX_API_KEY secret — skipping live MCP catalog."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # v7, was v5. `python-version` is untouched: v5's and v7's action.yml
      # differ by one ADDED input (`pip-version`) and `using: node20` ->
      # `node24`, which wants runner >= 2.327.1 — the GitHub-hosted
      # ubuntu-latest above is past it. v7 does remove an input, `pip-install`,
      # but that one only ever existed in v6.1 through v6.3, so nothing here
      # could have been using it. This action asks for no permissions.
      #
      # Unlike the artifact steps further down, this one is gated on the API
      # key alone, not on refresh_baselines — so an ordinary manual dispatch
      # does exercise it, and the nightly cron exercises it every night. It is
      # still unreachable from a pull request, because nothing in this file is.
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.13"

      # PINNED. This was `pip install mcp`, unpinned, and mcp 2.0.0 renamed
      # streamablehttp_client -> streamable_http_client. The nightly job died on the
      # import for two nights running (2026-07-29, 2026-07-30) and nobody found out,
      # because this workflow only ever spoke up when it FOUND drift — never when it
      # failed to look. Both halves are fixed: the pin here, and the failure issue
      # at the bottom.
      #
      # 1.29.0 is the last release before the rename and is what the last green run
      # (2026-07-28) used. Moving to 2.x is a deliberate migration with its own
      # verification against the live CSP endpoint, not something to inherit by
      # accident from a nightly cron.
      - name: Install MCP client (pinned — see comment)
        if: steps.gate.outputs.run == 'true'
        run: pip install --quiet 'mcp==1.29.0'

      # Fail here, loudly and cheaply, rather than inside the catalog run where the
      # traceback is buried. A dependency that no longer exports what this repo
      # imports is a broken detector, and it must not be discovered by reading logs.
      - name: Assert the MCP client still exports what the scripts import
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import importlib.metadata as md, sys
          try:
              from mcp.client.streamable_http import streamablehttp_client  # noqa: F401
          except ImportError as e:
              print(f"::error::the pinned mcp package ({md.version('mcp')}) no longer exports "
                    f"streamablehttp_client, which scripts/mcp_session.py imports: {e}")
              sys.exit(1)
          print(f"mcp {md.version('mcp')} exports streamablehttp_client, as scripts/mcp_session.py expects")
          PY

      - name: Catalog live MCP tools, services, cubes
        if: steps.gate.outputs.run == 'true'
        env:
          INFOBLOX_API_KEY: ${{ secrets.INFOBLOX_API_KEY }}
          INFOBLOX_URL: https://csp.infoblox.com
        # Into /tmp/live/ rather than /tmp/, so the same directory is what the
        # differ reads (--live-dir), what gets staged as the artifact, and what
        # the refresh job downloads. Three names for one set of files is how a
        # path drifts out of sync with the step that consumes it.
        run: |
          mkdir -p /tmp/live
          python scripts/catalog_tools.py > /tmp/live/live_tools.json
          python scripts/catalog_services.py > /tmp/live/live_services.json
          python scripts/catalog_cubes.py > /tmp/live/live_cubes.json

      # THE COMPARISON LIVES IN scripts/mcp_diff.py, NOT HERE.
      #
      # It used to be a heredoc in this file that compared NAMES ONLY. On
      # 2026-08-14 Infoblox marked 17 of 54 cubes deprecated — each gaining a
      # successor, a sunset date and a rewritten description, two of them cubes
      # Bloxsmith queries — and this step reported "Cubes: 0 added, 0 removed"
      # and opened nothing. It was not broken; it was answering a narrower
      # question than anyone believed it was asking.
      #
      # A detector that only runs inside CI cannot be tested, and an untested
      # detector is a belief. As a file it has a known-answer selftest, run below
      # BEFORE the real comparison, so this class of blind spot fails loudly here
      # instead of silently in production.
      - name: Prove the differ still detects what it claims to
        if: steps.gate.outputs.run == 'true'
        run: python scripts/mcp_diff.py --selftest

      - name: Diff vs committed snapshots
        if: steps.gate.outputs.run == 'true'
        id: diff
        run: |
          python scripts/mcp_diff.py \
            --snap-dir scripts \
            --live-dir /tmp/live \
            --github-output "$GITHUB_OUTPUT"

      # ONE THREAD, NOT ONE ISSUE A NIGHT.
      #
      # This opened a fresh "MCP drift detected (DATE)" issue on every run that saw
      # drift, and the baselines are only refreshed by hand — so the SAME unrefreshed
      # difference was re-reported every night and never closed. Five open issues had
      # piled up (2026-07-24 onward), each mostly repeating the last.
      #
      # That is why the two-night outage went unnoticed: the signal was already noise,
      # and one more quiet night looked like a good night. A detector that cries wolf
      # nightly has the same end state as one that says nothing.
      #
      # Now it comments on the open thread instead. A fresh issue appears only once
      # the previous one has been dealt with and closed, which makes a NEW issue mean
      # something again.
      #
      # Suppressed on a refresh run. A refresh is the maintainer acknowledging the
      # drift and rebasing the baselines onto it — commenting "still drifting" on the
      # very thread that refresh is about to resolve would be the cry-wolf problem
      # again, wearing a different hat. On a schedule run `inputs.refresh_baselines`
      # is null, `null != true` is true, and the nightly path is untouched.
      - name: Open or update the drift issue
        # `|| deadline_alert` is the load-bearing half. A sunset date breaks things
        # on a calendar day whether or not anything drifted, so gating this step on
        # `changed` alone means the countdown can only speak on a day something
        # else happened to move — which for NstarDnsActivity and HostMetrics would
        # be eleven months of silence followed by two dead dashboard panels.
        if: >-
          steps.gate.outputs.run == 'true'
          && (steps.diff.outputs.changed == 'true' || steps.diff.outputs.deadline_alert == 'true')
          && inputs.refresh_baselines != true
        env:
          GH_TOKEN: ${{ github.token }}
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          BANDS: ${{ steps.diff.outputs.deadline_bands }}
          BODY: ${{ steps.diff.outputs.body }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE="MCP drift detected — baselines need review"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MARKER="<!-- deadline_bands: $BANDS -->"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          # DO NOT COMMENT NIGHTLY ABOUT A DEADLINE THAT HAS NOT MOVED.
          #
          # When real drift exists, every night is worth saying — the baselines are
          # out of date until someone refreshes them. But a sunset date sitting at
          # "soon" for 120 days is ONE fact, and commenting it 120 times is exactly
          # the cry-wolf failure this workflow already had to be rescued from once
          # (five duplicate issues, 2026-07-24 onward), which is why the two-night
          # outage went unnoticed.
          #
          # So when the deadline is the ONLY reason we are speaking, the band set is
          # stamped into the text as an HTML marker, and a run whose marker is
          # already present says nothing. Crossing watch->soon->urgent->passed
          # changes the marker, and that speaks.
          if [ "$CHANGED" != "true" ] && [ -n "$EXISTING" ]; then
            if gh issue view "$EXISTING" --repo "${{ github.repository }}" \
                 --json body,comments --jq '.body, (.comments[].body)' 2>/dev/null \
                 | grep -qF "$MARKER"; then
              echo "::notice::No drift, and the deadline bands ($BANDS) are already recorded on issue #$EXISTING. Saying nothing."
              exit 0
            fi
          fi

          if [ -n "$EXISTING" ]; then
            {
              if [ "$CHANGED" = "true" ]; then
                printf 'Still drifting as of %s ([run](%s)).\n\n' "$DATE" "$RUN"
              else
                printf 'No drift as of %s, but a removal deadline moved ([run](%s)).\n\n' "$DATE" "$RUN"
              fi
              printf '%s\n\n%s\n' "$BODY" "$MARKER"
            } | gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file -
          else
            printf '%s\n\n%s\n' "$BODY" "$MARKER" | \
              gh issue create --repo "${{ github.repository }}" \
                --title "$TITLE" --label "mcp-drift" --body-file - || \
            printf '%s\n\n%s\n' "$BODY" "$MARKER" | \
              gh issue create --repo "${{ github.repository }}" \
                --title "$TITLE" --body-file -
          fi

      # REFRESH PATH ONLY — skipped on every scheduled run and on every manual run
      # with the box unticked.
      #
      # The catalog above is the ONLY place the live surface is read; it is not re-run
      # for the refresh. Its output is handed to the `refresh` job as an artifact, so
      # that job can open a PR without ever being given INFOBLOX_API_KEY, and without
      # this job — the one that installs a third-party pip package and talks to a live
      # tenant every night — needing write access to the repository.
      #
      # if-no-files-found: error, because "the refresh produced no catalog" must be a
      # red run, never a quiet one.
      #
      # Staged into the workspace first rather than uploaded straight from /tmp. Paths
      # that reach outside the working directory are exactly the shape that passed
      # every dry run and then failed at the real thing in the goreleaser extra_files
      # incident; a two-line cp is cheaper than finding out again.
      - name: Stage the live catalog for the refresh job
        if: steps.gate.outputs.run == 'true' && inputs.refresh_baselines == true
        run: |
          mkdir -p live-catalog
          cp /tmp/live/live_tools.json /tmp/live/live_services.json /tmp/live/live_cubes.json live-catalog/

      # v7, was v4. Nothing this step passes moved: `name`, `path`,
      # `if-no-files-found` and `retention-days` are identical in v4's and v7's
      # action.yml. v5/v6/v7 were a Node 20 -> 24 runtime march requiring runner
      # >= 2.327.1, which the GitHub-hosted ubuntu-latest above already is.
      #
      # v7's one new input is `archive`, default `true` — the v4 behaviour, and
      # left at the default on purpose. `archive: false` uploads a single file
      # unzipped and IGNORES `name`, and the refresh job fetches this artifact
      # BY name. Setting it would break the handoff at the only moment this path
      # ever runs.
      - name: Hand the live catalog to the refresh job
        if: steps.gate.outputs.run == 'true' && inputs.refresh_baselines == true
        uses: actions/upload-artifact@v7
        with:
          name: live-mcp-catalog
          path: live-catalog/
          if-no-files-found: error
          retention-days: 1

      # A DETECTOR THAT CANNOT REPORT ITS OWN FAILURE IS NOT A DETECTOR.
      #
      # This workflow spoke up only when it FOUND drift. So a run that never got as
      # far as looking — a renamed dependency, an expired key, CSP unreachable —
      # looked exactly like a clean night: no issue, nothing in the inbox, and the
      # only evidence a red tick on a page nobody opens. It died on an ImportError
      # for two nights running before anyone noticed, and during those two nights
      # Infoblox could have reshuffled the whole surface unseen.
      #
      # Silence now means "checked, nothing changed" and nothing else.
      #
      # if: failure() so it fires for ANY failed step above, not just the ones
      # anticipated here. One open issue at a time, reused rather than duplicated —
      # a nightly cron that opens a fresh issue every night trains you to ignore it,
      # which is the same end state as saying nothing.
      - name: Report that the drift check could not run
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="MCP drift check is FAILING — it is not watching for drift"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          BODY=$(cat <<EOF
          The nightly MCP drift check failed, so **the undocumented Infoblox CSP \`/mcp\`
          surface is not being watched** until this is fixed. This is not a drift report —
          it is a report that no drift report can be trusted right now.

          Failed run: $RUN

          Silence from this workflow normally means "checked, nothing changed". While this
          issue is open it means nothing at all.
          EOF
          )

          if [ -n "$EXISTING" ]; then
            # Comment rather than open a duplicate: still visible, still one thread.
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --label "mcp-drift" --body "$BODY" || \
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY"
          fi

  # REFRESH THE COMMITTED BASELINES — manual only, never scheduled.
  #
  # Why a second job at all: pushing the refresh branch needs `contents: write`.
  # The drift job needs no write scope at all, and it is the job that
  # installs a third-party pip package and speaks to a live tenant every single night —
  # mcp 2.0.0 already broke it once from a version bump alone. Permanently widening
  # THAT job's token, for a button pressed a handful of times a year, is the wrong
  # trade. So the write scope lives here instead: minimum for the task, in a job that
  # runs only on an explicit dispatch and is never handed INFOBLOX_API_KEY at all.
  #
  # It re-runs nothing. It consumes the catalog the drift job already produced.
  refresh:
    needs: drift
    # `needs:` already skips this job when the drift job failed. Said out loud anyway,
    # because it is the load-bearing guarantee here: a catalog that could not look must
    # never produce a PR claiming a refresh it did not perform.
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.refresh_baselines == true
      && needs.drift.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refresh branch
      # issues: write, NOT pull-requests: write. This job used to open a PR with
      # peter-evans/create-pull-request, and the first time it was ever exercised
      # (2026-08-14, run 31794493703) it failed:
      #
      #   GitHub Actions is not permitted to create or approve pull requests
      #
      # That is a repo setting, off by default. Turning it on would grant EVERY
      # workflow here the right to create PRs and to approve reviews — the approve
      # half can bypass a review requirement — in exchange for a button pressed a
      # few times a year. So the need was removed instead: this job pushes a branch
      # and prints the compare URL, and a human clicks it. Same review step, no new
      # permissions.
      #
      # Dropping PR creation frees exactly the scope the failure reporter at the
      # bottom needs. Net permissions are unchanged, not widened.
      issues: write # open/comment the "refresh failed" issue
    steps:
      # A refresh that was asked for and not performed must be a red run, not a green
      # skip. The drift job warns and skips when there is no INFOBLOX_API_KEY, which is
      # right for a fork — but here it means the maintainer ticked the box and got
      # nothing, and a silently skipped job reads exactly like a successful one.
      - name: Assert the drift job actually catalogued the live surface
        if: needs.drift.outputs.catalogued != 'true'
        run: |
          echo "::error::The drift job did not run the live catalog (no INFOBLOX_API_KEY secret), so there is nothing to refresh the baselines FROM. Nothing was changed and no PR was opened."
          exit 1

      - uses: actions/checkout@v7

      # v8, was v4. `name` and `path` are unchanged across v5-v8. v5's breaking
      # change moved the output path only for downloads by `artifact-ids`; this
      # one is by name, which that release explicitly left alone. No new scopes:
      # a same-run artifact needs none, and `github-token` + `actions: read` are
      # only for reaching into another run.
      #
      # v8 does change one behaviour that lands here. A digest mismatch used to
      # log a warning and carry on; it now defaults to failing the run
      # (`digest-mismatch: error`). Left at the default deliberately — a catalog
      # that arrived corrupted is a catalog that could not look, and the guards
      # below exist precisely so that such a thing is never written over a good
      # baseline. A warning in a log nobody reads is how it would have got past
      # them before.
      - name: Fetch the live catalog the drift job already produced
        uses: actions/download-artifact@v8
        with:
          name: live-mcp-catalog
          path: /tmp/live

      # "THE JOB LOOKED AND FOUND NOTHING" vs "THE JOB COULD NOT LOOK" — the same
      # distinction the rest of this workflow is built around, applied to the write.
      #
      # A catalog script can exit 0 and still be useless: list_all_cubes returning an
      # empty list, or a per-item lookup that failed and got stored as {"error": ...}
      # instead of data (see the `except` arms in catalog_services.py and
      # catalog_cubes.py — both swallow and continue). Either would quietly overwrite a
      # good, complete baseline with a worse one, and the drift check would then measure
      # against the damage every night afterwards, reporting green.
      #
      # Both are hard failures, checked BEFORE anything is copied. Stdlib json only —
      # this job deliberately has no mcp dependency and no API key.
      - name: Refresh the snapshots, refusing anything that is not a complete catalog
        id: refresh
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, shutil, sys

          PAIRS = [
              ("/tmp/live/live_tools.json",    "scripts/out_tools.json"),
              ("/tmp/live/live_services.json", "scripts/out_services.json"),
              ("/tmp/live/live_cubes.json",    "scripts/out_cubes.json"),
          ]
          TOP = {"all_services": "services", "all_cubes": "cubes"}
          DETAIL = ("service_details", "cube_details")

          def read(path):
              """(entry count, detail-block count or None, names of blocks that errored)."""
              with open(path) as fh:
                  data = json.load(fh)
              if isinstance(data, list):          # out_tools.json is a bare list
                  return len(data), None, []
              if not isinstance(data, dict):
                  raise ValueError(f"expected an object or a list, got {type(data).__name__}")
              top = next((k for k in TOP if k in data), None)
              det = next((k for k in DETAIL if k in data), None)
              if top is None or det is None:
                  raise ValueError("unrecognised snapshot shape (keys: "
                                   + ", ".join(map(str, data)) + ")")
              block = data[top]
              entries = block.get(TOP[top], []) if isinstance(block, dict) else block
              details = data[det] if isinstance(data[det], dict) else {}
              errored = sorted(n for n, v in details.items()
                               if isinstance(v, dict) and "error" in v)
              return len(entries), len(details), errored

          rows, fatal = [], []
          for live, snap in PAIRS:
              name = os.path.basename(snap)
              try:
                  n_live, d_live, errored = read(live)
              except Exception as exc:
                  fatal.append(f"{name}: the live catalog could not be read as a snapshot ({exc})")
                  continue
              if n_live == 0:
                  fatal.append(f"{name}: the live catalog is EMPTY. That is a catalog that could "
                               f"not look, not a surface with nothing on it, and it will not be "
                               f"written over a populated baseline.")
                  continue
              if errored:
                  fatal.append(f"{name}: {len(errored)} detail block(s) came back as an error "
                               f"instead of data ({', '.join(errored)}). That is a partial catalog.")
                  continue
              n_snap, d_snap, _ = read(snap)
              rows.append((name, n_snap, n_live, d_snap, d_live))

          if fatal:
              for msg in fatal:
                  print(f"::error::{msg}")
              print("Nothing was written. The committed baselines are untouched and no PR "
                    "will be opened.")
              sys.exit(1)

          for live, snap in PAIRS:
              shutil.copyfile(live, snap)

          def cell(v):
              return "—" if v is None else str(v)

          lines = [
              "Regenerated from the live Infoblox CSP `/mcp` surface by "
              f"[this workflow run]({os.environ['RUN_URL']}). Done in CI because "
              "`INFOBLOX_API_KEY` exists only as a repository secret — the catalog "
              "scripts cannot be run anywhere else.",
              "",
              "| snapshot | entries before | entries after | detail blocks before | detail blocks after |",
              "| --- | ---: | ---: | ---: | ---: |",
          ]
          for name, n_snap, n_live, d_snap, d_live in rows:
              lines.append(f"| `scripts/{name}` | {n_snap} | {n_live} | "
                           f"{cell(d_snap)} | {cell(d_live)} |")
          lines += [
              "",
              "Every detail block in this catalog returned data; none recorded an error. An "
              "empty list or an errored block fails the run instead of reaching this point, so "
              "a partial catalog can never appear here as a refresh.",
              "",
              "These counts summarise the file diff, they do not replace it — read the diff. "
              "A refresh records what the surface *is*; it does not check that nothing in this "
              "repo depended on what left. Confirm that before merging.",
              "",
              "This run did not open or update a drift issue: a refresh is not a drift report.",
          ]

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("body<<BODYEOF\n")
              fh.write("\n".join(lines) + "\n")
              fh.write("BODYEOF\n")
          print("\n".join(lines))
          PY

      # PUSH A BRANCH, DO NOT OPEN A PR. This was peter-evans/create-pull-request,
      # which failed the first and only time it ever ran (2026-08-14, run
      # 31794493703) with "GitHub Actions is not permitted to create or approve
      # pull requests" — a repo setting that is off by default. The fix is not to
      # turn that setting on: it would let every workflow here create PRs and
      # approve reviews, repo-wide, for a button pressed a few times a year.
      #
      # So the job commits the three snapshots to a branch, pushes it, and prints
      # the URL that opens the PR. A human still reviews the same diff. No action
      # dependency, no new scope.
      #
      # Per-run branch name. The old code targeted a fixed `mcp-baseline-refresh`,
      # and a stale branch of exactly that name already exists on this remote from
      # an old point in history — it would have been reset or collided with.
      #
      # `git add` names the three files explicitly, so whatever else a catalog run
      # left in the workspace cannot ride along.
      - name: Commit the refreshed snapshots to a branch and push it
        id: push
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BRANCH="mcp-baseline-refresh/${{ github.run_id }}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add scripts/out_tools.json scripts/out_services.json scripts/out_cubes.json

          # NOTHING TO REFRESH IS A SUCCESS, NOT A FAILURE. `git commit` exits 1 on
          # an empty index, which would turn "the baselines were already current"
          # into a red run and eventually into an ignored one.
          if git diff --cached --quiet; then
            echo "::notice::The live catalog matched the committed baselines exactly. Nothing to refresh, so no branch was pushed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore: refresh MCP baseline snapshots from the live CSP surface"
          git push origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Say what happened, and how to open the PR
        if: steps.push.outputs.pushed == 'true'
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          BODY: ${{ steps.refresh.outputs.body }}
        run: |
          {
            echo "## Refreshed baselines pushed"
            echo
            echo "Branch \`$BRANCH\`. **Open the PR:**"
            echo
            echo "${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
            echo
            echo "$BODY"
            echo
            echo "Once merged, delete the branch:"
            echo
            echo '```'
            echo "git push origin --delete $BRANCH"
            echo '```'
            echo
            echo "_Not deleted automatically: a branch may hold the only copy of a"
            echo "diff somebody is still reading._"
          } >> "$GITHUB_STEP_SUMMARY"

      # A REFRESH FAILURE IS NOT A DRIFT-CHECK FAILURE, and must not claim to be.
      #
      # The drift job's failure arm says "the surface is not being watched". Reusing
      # that text here would be a lie: the catalog and the diff both succeeded, and
      # only the write failed. Same one-thread discipline, different title, and it
      # names the stage that broke.
      #
      # This arm is why the job holds `issues: write` — a reporter without the scope
      # to report is the exact dead-detector shape the rest of this file exists to
      # prevent.
      - name: Report that the refresh could not be written
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="MCP baseline refresh FAILED to write — the snapshots are unchanged"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --state open --search "$TITLE in:title" --json number --jq '.[0].number' 2>/dev/null || true)

          BODY=$(cat <<EOF
          A baseline refresh was requested and **did not complete**. The committed
          snapshots in \`scripts/\` are untouched, so nothing was corrupted — but the
          refresh you asked for did not happen.

          This is NOT a report that drift detection is broken. The nightly drift check
          runs in a separate job and is unaffected; it will keep reporting the same
          drift every night until a refresh succeeds.

          Which stage failed is in the run log — the candidates are catalog validation
          (refuses an empty or partial catalog), the commit, or the push.

          Failed run: $RUN
          EOF
          )

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --label "mcp-drift" --body "$BODY" || \
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY"
          fi
