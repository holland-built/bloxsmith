name: CI

# Replaces the retired docker-publish.yml. Builds and tests the Go single-binary
# app (embedded UI) — no image publish, no signing. Releases are cut by the
# tag-triggered .github/workflows/release.yml; this workflow proves the tree
# builds on push/PR.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # UI freshness: fail if go/web/app.bundle.js is stale vs src/*.jsx.
      - name: UI dist up to date (vite build --check)
        run: |
          cd ui && npm ci && npm run build && cd ..
          diff -r ui/dist go/web >/dev/null || {
            echo "::error::go/web is stale — run: cd ui && npm run build && rm -rf ../go/web/* && cp -R dist/* ../go/web/"
            exit 1
          }

      # Client unit tests (node --test, no test framework dependency). Covers the
      # request timeout budgets in ui/src/lib/api.js.
      - name: UI tests
        working-directory: ui
        run: npm test

      # oxlint is in ui/devDependencies and `npm run lint` is in
      # ui/package.json, and neither has ever been executed by anything — not
      # this workflow, not a hook, not a pre-commit. `ui/.oxlintrc.json` even
      # raises react/rules-of-hooks to "error", so the repo wrote down a rule
      # it considered build-breaking and then never ran the tool that
      # enforces it. An installed linter no job invokes is not a gate, it is
      # a belief. The missing step was the defect; whatever it finds is only
      # the symptom.
      #
      # First run (2026-08-06, local, oxlint 1.71.0) exited 0 with 36
      # warnings and zero errors: 17 no-unused-vars (dead recharts imports in
      # src/components/ui.jsx, unused catch bindings), 10
      # react/only-export-components, 6 react-hooks/exhaustive-deps, 3
      # no-unused-expressions.
      #
      # Those 36 are non-blocking today, deliberately: oxlint's exit code
      # counts errors only, so warnings do not fail the build. Landing the
      # step at that setting means a NEW error — a rules-of-hooks violation
      # above all — stops the build the day it is written, instead of never.
      # Clearing the 36 and then adding `--deny-warnings` is follow-up work.
      # Gating on them now would have meant not landing the gate at all.
      # ui/.oxlintrc.json scopes react/only-export-components OFF for
      # components/ui.jsx, components/DataTable.jsx and lib/theme.jsx. The reason
      # cannot live in that file — oxlint rejects unknown keys, so it takes no
      # comments — so it lives here. That rule is a Vite fast-refresh hint: a
      # module exporting both components and non-components loses hot reload for
      # that file. Those three deliberately export constants and hooks alongside
      # components (ui.jsx exports useChartTheme and useThemeColors; theme.jsx
      # exports the provider AND the hooks that read it). Splitting them is a real
      # refactor for a developer-experience benefit only, so the rule is scoped
      # off rather than left as 11 standing warnings that hide the next real one.
      # Turn it back on for any of the three that is ever split.
      - name: UI lint (oxlint)
        working-directory: ui
        run: npm run lint

      # The govulncheck comment further down this file states that "the npm
      # side of the tree gets `npm audit`". It did not. No step in this
      # workflow — or in release.yml — has ever run `npm audit`. The sentence
      # was written as justification for adding the Go scan and was false the
      # day it was committed; it is true as of this step. A comment asserting
      # a control that does not exist is worse than no comment at all,
      # because it is exactly what stopped anyone from looking.
      #
      # What it was covering, from the first real run (2026-08-06): postcss
      # <=8.5.22, GHSA-fxqj-rqcc-2cmp, moderate — an incomplete fix of
      # GHSA-6g55-p6wh-862q, where an attacker-controlled sourceMappingURL
      # reads arbitrary .map files when `from` is unset. Transitive via
      # vite@8.1.5, so it is build tooling only and never reaches a shipped
      # bundle or a browser. Closed in the same commit as this step by `npm
      # audit fix` (postcss 8.5.22 -> 8.5.26, nanoid 3.3.16 -> 3.3.17;
      # ui/package-lock.json only). The bundle was rebuilt and diffed against
      # go/web afterwards and is byte-identical, so the "UI dist up to date"
      # step above is unaffected.
      #
      # --audit-level=moderate rather than the default: npm audit exits
      # non-zero on any advisory including "low", and a gate that reddens on
      # noise is a gate people learn to click past.
      - name: UI dependency vulnerability scan (npm audit)
        working-directory: ui
        run: npm audit --audit-level=moderate

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      # `go test` without -race has been the only thing checking this repo's
      # concurrent surface since the day it was written. Not "rarely run" —
      # never: `git log --all -S'-race' -- .github/ scripts/` returns no commit
      # at all, so the flag has never been added, never removed, never there.
      #
      # What that let through is a specific class, not a vague one: a data race
      # whose outcome happens to be correct on the machine that ran it. In Go an
      # unsynchronised access from two goroutines is undefined behaviour, and its
      # two usual endings are a torn read that only misbehaves under a different
      # scheduler or word size, and a concurrent map write that aborts the whole
      # process with no recovery. A green `go test ./...` cannot tell either of
      # those apart from correct code, because both produce the right answer on
      # the run that observed them. The race detector is the only thing here that
      # reports the ACCESS rather than the result.
      #
      # Three places in the tree were already written on the belief this was on,
      # which is the real evidence that its absence was a defect rather than a
      # missing nicety:
      #
      #   * internal/sse/sse_test.go — TestEmit_SingleGoroutineUsage_RaceClean,
      #     whose own comment says it "runs it under -race as a regression check".
      #     Without -race that test asserts nothing whatsoever: it calls emit 50
      #     times and inspects no value, so the only way it could ever fail was a
      #     panic. It has been a no-op for its entire life, and its name says
      #     otherwise.
      #   * internal/vault/vault.go:102 — the lock-guarded accessors are
      #     documented as a "(data-race fix)". Nothing has ever confirmed the fix
      #     holds. A guard never watched to refuse is a belief, not a guard.
      #   * internal/store/budget_test.go — TestBudget_ConcurrentAddTokens, "run
      #     with -race, per the task ... would catch both the data race and the
      #     lost-update". That sentence is wrong, and it is recorded here rather
      #     than left to mislead whoever reads it next: budgetMu serialises a
      #     read-modify-write of ai_budget.json, which is a FILE. The detector
      #     instruments memory accesses and is blind to it. Checked by deleting
      #     the lock — the test fails either way, but on its token-total
      #     assertion ("= 37, want 1850"), and -race reports no race at all. The
      #     assertion is that test's guard; this flag is not.
      #
      # This step was watched to refuse before it was committed, rather than
      # assumed to work. Deleting the c.mu.Lock()/Unlock() pairs from Cache.Do in
      # internal/cache/cache.go — the single-flight path the package's concurrent
      # tests drive from many goroutines at once — leaves `go test
      # ./internal/cache/` GREEN in 0.33s, and produces four "WARNING: DATA RACE"
      # reports under `go test -race`, on concurrent reads and writes of the
      # entries and inflight maps. That is the class described above,
      # demonstrated against this repo's own code: as the suite stands today it
      # reports an unsynchronised map access as a pass. The lock was restored
      # immediately and none of that experiment is in this commit.
      #
      # First run (2026-08-06, local, darwin/arm64, Go 1.26.3): ZERO races. Full
      # suite at -count=1, all 16 test packages, nothing cached. Then repeated,
      # because one pass of a timing-dependent check is one sample and not a
      # result — -count=5 over sse, cache, store, httpx, dashboard, rest and mcp,
      # and -count=3 over internal/server and the root package (the two slowest).
      # Still zero. So this step lands as a gate on what gets written next, not
      # as the fix for something found today, and that is stated here rather than
      # left for someone to infer from an empty diff.
      #
      # Cost, measured rather than estimated: 21.2s -> 156.1s wall for the full
      # suite. internal/vault is 153.7s of that (19.7s without), and all of it is
      # scrypt — kdfByVersion runs at N=2^17 and the instrumentation multiplies
      # every round. Vault is kept in regardless: it holds the repo's only
      # "(data-race fix)" comment, so it is the last package that should be
      # exempted to save minutes. The macos job below runs in parallel with this
      # one, so the critical path grows by about that same 2.5 minutes, not twice
      # it.
      - name: Go build + test (-race) + vet
        working-directory: go
        run: |
          go build ./...
          go test -race ./...
          go vet ./...

      # `go vet` has run here since this workflow was written and formatting has
      # never been checked at all — so four files (internal/account/account.go,
      # internal/audit/audit.go, internal/rest/rest.go, internal/server/server.go)
      # were not gofmt-clean for the entire life of the repo and nothing noticed.
      # The four files were the symptom; the ABSENCE of this step was the defect.
      # vet and fmt are different tools: vet reports suspicious constructs, gofmt
      # reports layout, and neither implies the other.
      #
      # It names the offending files. A gate that exits 1 without saying what is
      # wrong just moves the work onto whoever reads the red X.
      #
      # Linux job only, deliberately: gofmt's output depends on the Go version,
      # not the OS, and both jobs pin the same `go-version: '1.26.x'` (local dev
      # is on 1.26.3 — same formatting rules, so this cannot flake between the
      # two). Repeating it in the macos job would print the same failure twice
      # for one defect. The macos job exists for surfaces that genuinely differ
      # per-OS (keychain, launchd); formatting is not one of them.
      - name: Go formatting (gofmt -l)
        working-directory: go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean — run: cd go && gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      # Nothing in this repo has ever checked a dependency for known CVEs. The
      # npm side of the tree gets `npm audit`; the Go side — which is the actual
      # product, and the only half that touches Infoblox credentials — got
      # nothing at all. `go build` and `go vet` do not look at advisories.
      #
      # govulncheck over `npm audit`'s model deliberately: it is call-graph
      # aware, so it reports a CVE only when this code can actually reach the
      # affected function. A version-range matcher would flag every transitive
      # module and train whoever reads the red X to skip it.
      #
      # First run (2026-08-03, local, Go 1.26.3) found three reachable stdlib
      # advisories — GO-2026-5856 / -5039 / -5037 — all fixed by the toolchain
      # patch alone. CI was already green on them, because `go-version: 1.26.x`
      # resolves to the newest patch while local dev sat on .3. That asymmetry
      # is the reason this belongs in CI *and* the reason CI alone is not
      # enough: a developer's machine can be behind what CI ships.
      # PINNED, was `@latest` until 2026-08-12. `@latest` resolves to whatever
      # shipped that morning, so the same commit could pass today and fail
      # tomorrow with nothing in this repo having changed — and the person
      # looking at the red X has no way to tell a new advisory from a new
      # scanner. Bumping this line is then a real commit with a real diff, which
      # is what makes a failure attributable. v1.6.0 is current stable, read
      # from `go list -m -versions golang.org/x/vuln` on 2026-08-12.
      #
      # The vulnerability DATABASE is still live (vuln.go.dev) and must be — a
      # pinned scanner reading a frozen advisory list would be theatre. Only the
      # tool version is fixed.
      #
      # Policy: every reachable finding fails the build, and there is no
      # severity gate. govulncheck has no severity field to gate on, and
      # "reachable from this code" is already a stricter filter than severity.
      # Adding an allowlist on top would mean maintaining one, which nobody does.
      #
      # State on 2026-08-12, run locally against the same module: 0 reachable
      # vulnerabilities. One module-level advisory exists and is deliberately
      # not actioned — GO-2026-5932, golang.org/x/crypto/openpgp unmaintained,
      # "Fixed in: N/A", pulled in transitively and never called by this code.
      # There is no version to move to, so the only options are ignore it or
      # drop x/crypto; govulncheck already reports it as uncalled and exits 0.
      - name: Go known-vulnerability scan (govulncheck)
        working-directory: go
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      # A green `go test ./...` proves the tests ran; it does not prove any
      # given security control is what made them pass. Three times in one day
      # a control was silently unprotected because its test drove a stub
      # instead of the production wiring (restore-plan --apply's per-tenant
      # write lock hardcoded to true, vault-rotate's verification result
      # ignored, the AI budget fabricating a limit it was never told) — and
      # the WHOLE SUITE stayed green every time. This deletes each control by
      # hand, one at a time, and fails the build if the suite does not go red.
      - name: Security controls are actually caught by the test suite (mutation test)
        run: bash scripts/control-guard.sh

      # Runs the SHIPPED `bloxsmith audit verify` binary and asserts all three
      # verdicts, all four exit codes, and its two refusals (never creates a key,
      # never reseals). A Go test covers the package; only this covers the thing
      # an operator types. Kept in a committed script, not inline YAML, for the
      # reason recorded in v3.24.0.
      - name: Offline audit verifier (runs the real binary)
        run: bash scripts/audit-verify-test.sh

      # relsign signs every release. Until now it ran exactly twice in its life,
      # both inside release.yml at tag time, and only ever on a GOOD signature —
      # nothing anywhere checked that it REFUSES a tampered file, a wrong key or a
      # missing signature. It is the trust anchor for `bloxsmith update`, so a
      # verifier that cannot fail is the worst thing it could quietly become.
      - name: Release signer refuses tampered/wrong-key/missing signatures
        run: bash scripts/relsign-test.sh

      # Embedded-UI + multi-arch smoke: cross-compile every target, no publish.
      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      # goreleaser does not bundle an SBOM generator; the `sboms:` block in
      # go/.goreleaser.yaml shells out to `syft` and the pipe FAILS the run if it
      # is missing. release.yml installs it too — the copy here is the point of
      # this step, not a redundancy. A syft installer that breaks (moved asset,
      # yanked tag, deprecated action) would otherwise surface for the first time
      # at `git push --tags`, on a tag that already exists, midway through
      # publishing a release. Here it is a red X on a pull request.
      - name: Install syft (goreleaser shells out to it for SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      - name: goreleaser build (snapshot, no publish)
        working-directory: go
        run: goreleaser build --snapshot --clean

      # `goreleaser build` CANNOT produce an SBOM, and that is the whole reason
      # this second, heavier invocation exists. Measured 2026-08-06 with
      # goreleaser v2.17.0: `build --snapshot --clean` emits only the per-target
      # binary directories and artifacts.json — no archives at all — and
      # `sboms: artifacts: archive` has nothing to catalog, so the pipe never
      # runs and prints nothing. An assertion bolted onto the step above could
      # therefore never pass, and the honest fix is to run the mode that does the
      # work rather than to weaken the assertion until it goes green.
      #
      # `release --snapshot` runs the archive → sbom → checksum chain for real.
      # The three skips are each load-bearing:
      #   publish — no tag, no GitHub Release, nothing leaves the runner
      #   sign    — cosign keyless needs an OIDC token, and this workflow
      #             deliberately has no `id-token: write` permission (it is a
      #             build/test workflow; release.yml is the one that signs). The
      #             sbom signing entry in .goreleaser.yaml is therefore NOT
      #             exercised here. It was verified locally instead, by putting a
      #             stub `cosign` on PATH and confirming the sign pipe is handed
      #             all four .sbom.json paths after cataloguing and writes a .sig
      #             and .pem beside each.
      #   docker  — dockers_v2 builds linux/amd64 + linux/arm64, which needs the
      #             QEMU and buildx setup that only release.yml does.
      #
      # Cost: it repeats the cross-compile the step above already did (~30s
      # locally). Kept separate rather than replacing that step, because the
      # plain `build` smoke test is the narrower check and is worth keeping able
      # to fail on its own. If CI minutes ever matter more than that, the two
      # collapse into this one — `release --snapshot` is a strict superset.
      - name: goreleaser release (snapshot) — the mode that actually emits SBOMs
        working-directory: go
        run: goreleaser release --snapshot --skip=publish,sign,docker,homebrew --clean

      # A skipped step and a working one look identical from the outside, and
      # this step exists because ONE of the two ways this breaks is exactly that
      # shape. Both were run rather than assumed (2026-08-06, local):
      #
      #   * syft missing from PATH — LOUD. goreleaser stops the release with
      #     `could not catalog artifact ... executable file not found in $PATH`.
      #     Confirmed by hiding the syft binary and re-running. The Install syft
      #     step above is what keeps that from happening at tag time.
      #   * the `sboms:` block's artifact selector no longer matching anything —
      #     SILENT. Confirmed by running the same config with `artifacts:`
      #     changed to a value this project produces none of: goreleaser printed
      #     nothing, wrote zero SBOMs, and EXITED 0. A release cut that way stays
      #     green and every artifact from then on ships with no ingredients list,
      #     with nothing anywhere saying so. Deleting the block entirely does the
      #     same. That is the failure this step catches and nothing else does.
      #
      # It does not just check "a file exists" — it counts. One SBOM PER ARCHIVE
      # is the contract, so a run that silently catalogued three of four archives
      # fails here rather than shipping a partial answer.
      #
      # Watched to refuse before being committed, on four hand-made bad dist/
      # trees: one SBOM deleted ("3 SBOMs for 4 archives"), all four deleted
      # ("ZERO SBOMs for 4 archives"), one replaced by a syntactically valid but
      # hollow document ("has no stdlib"), and one removed from checksums.txt
      # ("not in checksums.txt"). All four exited 1; the untouched tree passed.
      #
      # The two counts are now kept APART. The `ui-npm-sbom` entry added a fifth
      # document that is not derived from any archive, and the original check
      # counted every *.sbom.json against the archive count — so landing that
      # entry would have turned this step red for the wrong reason ("5 SBOMs for
      # 4 archives") and the tempting fix is to loosen the comparison to `-ge`.
      # That would throw away the whole point of counting. Each family is
      # asserted against its own expected number instead.
      - name: The SBOMs actually exist, one per archive plus the UI's, and are in checksums.txt
        working-directory: go
        run: |
          set -euo pipefail
          # Expected filenames, confirmed from a real run rather than guessed:
          # goreleaser names each archive SBOM <archive>.sbom.json, e.g.
          # bloxsmith_3.53.1-snapshot-<sha>_linux_amd64.tar.gz.sbom.json, and the
          # UI one is named by the `documents:` template —
          # bloxsmith_3.53.1-snapshot-<sha>_ui_npm.sbom.json.
          archives=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')
          sboms=$(find dist -maxdepth 1 \( -name '*.tar.gz.sbom.json' -o -name '*.zip.sbom.json' \) | wc -l | tr -d ' ')
          echo "archives=$archives archive-sboms=$sboms"
          ls -la dist/*.sbom.json || true

          if [ "$archives" -eq 0 ]; then
            echo "::error::no archives in dist/ at all — the archive pipe did not run, so this step cannot say anything about SBOMs"
            exit 1
          fi
          if [ "$sboms" -eq 0 ]; then
            echo "::error::goreleaser produced $archives archives and ZERO SBOMs — the sboms: block in go/.goreleaser.yaml did not run (syft missing from PATH, or its artifact selector no longer matches anything)"
            exit 1
          fi
          if [ "$sboms" -ne "$archives" ]; then
            echo "::error::$sboms SBOMs for $archives archives — some archive shipped without one"
            exit 1
          fi

          # Non-empty and structurally real. syft's default output here is SPDX
          # 2.3 JSON (NOT CycloneDX — `.packages`, not `.components`); a zero-byte
          # or truncated file would still satisfy a bare existence check.
          for f in dist/*.tar.gz.sbom.json dist/*.zip.sbom.json; do
            n=$(jq '.packages | length' "$f")
            if [ "$n" -lt 2 ]; then
              echo "::error::$f lists $n packages — an SBOM naming only the archive itself is an empty answer"
              exit 1
            fi
            # The compiled-in toolchain version is the one entry that is always
            # present when syft really read the binary, so it is the cheapest
            # proof this catalogued the Go module graph rather than an empty dir.
            jq -e '.packages[] | select(.name == "stdlib")' "$f" >/dev/null || {
              echo "::error::$f has no stdlib package — syft did not read the Go binary inside the archive"; exit 1; }
            echo "$f: $n packages"
          done

          # --- the UI's npm SBOM -------------------------------------------
          # Its own family, its own failure modes. `artifacts: any` runs a
          # command goreleaser does not understand the output of, so the ways it
          # breaks are different from the archive pipe's: the hardcoded
          # `file:../../ui/package-lock.json` path resolving to nothing (the cmd
          # runs with cwd=dist/, so a plausible-looking `../ui` is wrong), or
          # syft cataloguing the lockfile but finding no packages in it.
          ui=$(find dist -maxdepth 1 -name '*_ui_npm.sbom.json' | wc -l | tr -d ' ')
          if [ "$ui" -ne 1 ]; then
            echo "::error::expected exactly 1 UI npm SBOM in dist/, found $ui — the ui-npm-sbom entry in go/.goreleaser.yaml did not run"
            exit 1
          fi
          uif=$(find dist -maxdepth 1 -name '*_ui_npm.sbom.json')
          un=$(jq '.packages | length' "$uif")
          echo "$uif: $un packages"
          [ "$(jq -r '.name' "$uif")" = "bloxsmith-ui-npm" ] || {
            echo "::error::$uif does not call itself bloxsmith-ui-npm — --source-name was dropped, and the image attestation in release.yml keys off that name"; exit 1; }

          # It must name what actually ends up in go/web/app.bundle.js. These
          # three are the reason this SBOM exists at all: they are compiled into
          # the bundle, the bundle is //go:embed'd, and none of them appear in
          # any archive SBOM above.
          for p in react react-dom recharts; do
            jq -e --arg p "$p" '.packages[] | select(.name == $p)' "$uif" >/dev/null || {
              echo "::error::$uif does not list $p — it catalogued something, but not this project's UI dependencies"; exit 1; }
          done

          # ...and it must NOT overstate. syft's javascript cataloger has
          # include-dev-dependencies off by default, which is what keeps this to
          # the production closure; if that default ever flips, this SBOM starts
          # claiming a linter ships inside the binary. oxlint is the cleanest
          # canary: it is a devDependency with no production package
          # peer-depending on it. `vite` is deliberately NOT checked here — it is
          # in devDependencies but @tailwindcss/vite (a production dependency)
          # peer-depends on it, so npm does not mark it dev and it legitimately
          # appears. See the block comment in go/.goreleaser.yaml.
          if jq -e '.packages[] | select(.name == "oxlint")' "$uif" >/dev/null; then
            echo "::error::$uif lists oxlint — devDependencies leaked in, so this SBOM claims build tooling ships inside the binary"
            exit 1
          fi

          # checksums.txt is what the Ed25519 and sshsig release signatures cover,
          # so an SBOM missing from it is an SBOM outside the signed set.
          for f in dist/*.sbom.json; do
            grep -q " $(basename "$f")\$" dist/checksums.txt || {
              echo "::error::$(basename "$f") is not listed in checksums.txt — it falls outside the signed set"
              cat dist/checksums.txt; exit 1; }
          done
          echo "$sboms archive SBOMs + 1 UI npm SBOM ($un packages), all non-trivial and all in checksums.txt"

  # ── macOS ───────────────────────────────────────────────────────────────────
  # This repo's CI was Linux-only, and that means two shipped surfaces had NEVER
  # been executed anywhere:
  #
  #   * the macOS keychain. internal/vault/keychain_test.go skips off darwin with
  #     a stated reason, which is honest — and left the whole feature unexercised
  #     in CI. v3.30.1 was a bug in exactly that code, found by hand minutes after
  #     shipping v3.30.0.
  #   * `bloxsmith service install|start|stop|uninstall`, which is what README.md
  #     and the Homebrew caveats tell every user to run. install.sh calls it, but
  #     only when stdin is a TTY, and CI never is — so the existing install job has
  #     never reached that branch.
  #
  # The general form of the lesson: a check that only runs on one OS can be broken
  # on another and pass silently. That is how a dead privacy scan went unnoticed in
  # ~/.claude for weeks.
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      # The same three commands the Linux job runs, on darwin. The keychain tests
      # that skip on Linux run for real here, against the runner's login keychain.
      #
      # -race is here for the same reason the whole job is, and it is not
      # redundant with the Linux copy. The detector is compiled into the test
      # binary per GOOS/GOARCH, so a clean run on linux/amd64 says nothing about
      # the darwin/arm64 build users actually install; and whether two goroutines
      # interleave badly is decided by the scheduler and the core count, which
      # differ between ubuntu-latest and macos-latest. A race that never loses on
      # one runner can lose on the other, which is the same lesson this job's own
      # header records about one-OS checks. See the Linux step for what the
      # flag's absence let through and for the measured cost.
      #
      # Deliberately NOT added to the "Assert the keychain tests actually RAN"
      # step below: that step exists to prove those two tests are not skipped, it
      # re-runs what this line already covered under the detector, and adding it
      # there would pay internal/vault's scrypt-under-instrumentation bill a
      # second time in the same job for no extra coverage.
      - name: Go build + test (-race) + vet (darwin — runs the keychain tests for real)
        working-directory: go
        run: |
          go build ./...
          go test -race ./...
          go vet ./...

      # Proves the keychain tests were not all skipped here too. A suite that
      # silently skips everything is the failure mode this whole job exists for,
      # and it looks identical to a passing one.
      #
      # The expected count is COUNTED FROM THE SOURCE, not written here as a
      # number. The first version of this step hardcoded ">= 3 expected several",
      # which was a guess — there are two — so it failed on a run where both tests
      # had passed. A threshold nobody counted is a fabricated value, and it fails
      # the build for a fact about the check rather than about the code.
      - name: Assert the keychain tests actually RAN (not skipped)
        working-directory: go
        run: |
          set -euo pipefail
          WANT=$(grep -cE '^func Test[A-Za-z]*Keychain[A-Za-z]*\(' internal/vault/keychain_test.go)
          if [ "$WANT" -lt 1 ]; then
            echo "::error::found no Keychain-named tests in internal/vault/keychain_test.go — either they were renamed or this grep is wrong; either way this step is no longer checking anything"
            exit 1
          fi
          go test -v -run 'Keychain' ./internal/vault/ 2>&1 | tee /tmp/kc.log
          if grep -qE '^\s*--- SKIP' /tmp/kc.log; then
            echo "::error::a keychain test SKIPPED on macOS — this job exists to run them"
            grep -E '^\s*--- SKIP' /tmp/kc.log
            exit 1
          fi
          RAN=$(grep -cE '^\s*--- PASS' /tmp/kc.log || true)
          if [ "$RAN" -ne "$WANT" ]; then
            echo "::error::$RAN of $WANT Keychain tests passed on macOS — the rest did not run"
            exit 1
          fi
          echo "all $WANT keychain tests ran and passed on macOS"

      # The offline audit verifier on darwin. It was only ever run on Linux, and
      # it shells out to shasum and ssh-keygen, which differ between the two --
      # macOS openssl cannot do raw ed25519 at all, which is why ssh-keygen -Y is
      # the only verifier that works on Mac, Linux and Windows alike.
      - name: Offline audit verifier on macOS (runs the real binary)
        run: bash scripts/audit-verify-test.sh

      # The keychain CLI, end to end, against a real keychain and a real encrypted
      # vault created by the real server. Go tests cover the package; only this
      # covers what an operator types -- which is where v3.30.1's bug was.
      - name: vault-passphrase CLI round trip (real keychain, real vault)
        run: bash scripts/vault-passphrase-test.sh

      # install -> status -> start -> HTTP -> stop -> restart -> uninstall, against
      # real launchd. The runner is disposable, which is the only place this is
      # safe to run: the service name is a fixed constant, so on a real machine it
      # would deregister a live deployment. See the script's own refusal.
      - name: service CLI round trip (real launchd)
        env:
          BLOXSMITH_SERVICE_TEST: yes-this-machine-is-disposable
        run: bash scripts/service-cli-test.sh

      # The refusal that keeps the step above off a real machine. If it ever stops
      # refusing, someone's live service gets deregistered by a test run.
      - name: the service test REFUSES without the disposable-machine opt-in
        # The opt-in is deliberately absent here — that is the whole point. The
        # job-level env sets it for the step above only.
        env:
          BLOXSMITH_SERVICE_TEST: ''
        run: |
          set -uo pipefail
          # `code=$?` AFTER an `if` captures the exit status of the IF STATEMENT
          # (0 when the branch is not taken), not of the command inside it. The
          # first version of this step did exactly that, read the refusal's exit 2
          # as 0, and failed a run in which the refusal had worked perfectly.
          # `|| code=$?` is the form that survives GitHub's default `bash -e`.
          code=0
          bash scripts/service-cli-test.sh > /tmp/refuse.log 2>&1 || code=$?

          if [ "$code" -eq 0 ]; then
            echo "::error::service-cli-test.sh RAN without the opt-in — on a real machine it would have deregistered a live deployment"
            cat /tmp/refuse.log
            exit 1
          fi
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit 2 (refused), got $code — it failed, but not by refusing"
            cat /tmp/refuse.log
            exit 1
          fi
          grep -q "REFUSED" /tmp/refuse.log || {
            echo "::error::exit 2 but no refusal message — it failed for some other reason"
            cat /tmp/refuse.log; exit 1; }
          echo "refused correctly, exit 2, with the refusal message"

  # install.sh had NO test at all, and it showed: v3.23.0 shipped with a mangled
  # `EXPECTED="$(...)"` assignment that turned the checksum lookup into a command
  # invocation. `bash -n` passes on that — it is valid syntax, just wrong — so the
  # only check that catches it is running the thing. This job installs the real
  # latest release and asserts BOTH verification lines actually printed: a
  # verification step that silently stops running is worse than none, because the
  # output still looks like a clean install.
  install-sh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Every shipped shell script, not just install.sh. shellcheck is a LINTER
      # and proves nothing on its own — v3.23.0's broken install.sh was valid
      # syntax — so it is a cheap pre-filter, and the steps that RUN each script
      # are the real gate.
      - name: shellcheck (Error severity gate, every shipped shell script)
        run: |
          shellcheck -S error \
            scripts/install.sh \
            scripts/audit-verify-test.sh \
            scripts/relsign-test.sh \
            scripts/vault-passphrase-test.sh \
            scripts/service-cli-test.sh \
            scripts/control-guard.sh \
            update.sh update.command

      # update.sh / update.command / update.bat are the documented Docker update
      # path (docker-compose.yml's header and docs/SHIP.md both point at them) and
      # all three do one thing: `docker compose pull && up -d` in their own
      # directory. Nothing executed them, and the only way they break is the
      # compose file they depend on failing to parse — so that is what gets
      # checked. Actually pulling images on every push is not worth the minutes.
      - name: The Docker update path's compose file parses
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config >/dev/null
          echo "docker-compose.yml parses; update.{sh,command,bat} have a valid target"
          # Each script must cd to its own directory first, or double-clicking it
          # from anywhere runs compose against the wrong (or no) project.
          for f in update.sh update.command; do
            grep -q 'cd "$(dirname "$0")"' "$f" || {
              echo "::error::$f does not cd to its own directory — double-clicking it would fail"; exit 1; }
          done
          grep -q 'cd /d "%~dp0"' update.bat || {
            echo "::error::update.bat does not cd to its own directory"; exit 1; }

      - name: install.sh installs the latest release, verifying both times
        run: |
          set -euo pipefail
          bash scripts/install.sh --prefix "$RUNNER_TEMP/bx" | tee "$RUNNER_TEMP/install.log"
          grep -q "signature: ok" "$RUNNER_TEMP/install.log" || {
            echo "::error::install.sh did not verify the release signature"; exit 1; }
          grep -q "checksum : ok" "$RUNNER_TEMP/install.log" || {
            echo "::error::install.sh did not verify the checksum"; exit 1; }
          "$RUNNER_TEMP/bx/bloxsmith" --version

      # The refusal paths matter more than the happy one: a check that cannot
      # fail is decoration. A curl shim serves the real release assets from disk
      # so the archive can be validated against a checksums.txt we have edited.
      - name: install.sh refuses a tampered or unsigned checksums.txt
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/shim"; mkdir -p "$W/bin" "$W/rel"
          BASE=https://github.com/holland-built/bloxsmith/releases/latest/download
          for f in checksums.txt checksums.txt.ed25519; do
            curl -fsSLo "$W/rel/$f" "$BASE/$f"
          done
          NUM="$(sed -n 's/.*bloxsmith_\([0-9][^_]*\)_.*/\1/p' "$W/rel/checksums.txt" | head -1)"
          curl -fsSLo "$W/rel/bloxsmith_${NUM}_linux_amd64.tar.gz" \
            "$BASE/bloxsmith_${NUM}_linux_amd64.tar.gz"
          printf '%s\n' '#!/bin/sh' 'out=""; url=""' \
            'while [ $# -gt 0 ]; do case "$1" in -*o) out="$2"; shift 2;; -*) case "$1" in *o) out="$2"; shift 2;; *) shift;; esac;; *) url="$1"; shift;; esac; done' \
            'f="$(basename "$url")"; [ -f "$REL/$f" ] || exit 22; cp "$REL/$f" "$out"' > "$W/bin/curl"
          chmod +x "$W/bin/curl"

          sed -i 's/^./f/' "$W/rel/checksums.txt"
          if PATH="$W/bin:$PATH" REL="$W/rel" bash scripts/install.sh --prefix "$W/out" > "$W/tampered.log" 2>&1; then
            echo "::error::install.sh installed from a tampered checksums.txt"; cat "$W/tampered.log"; exit 1
          fi
          grep -q "SIGNATURE DOES NOT VERIFY" "$W/tampered.log" || {
            echo "::error::the refusal did not name the signature as the reason"; cat "$W/tampered.log"; exit 1; }
          echo "tampered checksums.txt refused, as it must be"

      # THE ACTUAL ATTACK, and the one v3.23.1 was vulnerable to: an attacker who
      # can write release assets replaces the archive, rewrites checksums.txt to
      # match it, and DELETES the signature files. The shipped v3.23.1 installer
      # printed "signature: none published for this release — checksum only",
      # then "checksum : ok", then installed the attacker's binary. Verified by
      # hand against the real release before the fix. A signature that only
      # protects you while the attacker leaves it in place protects nobody.
      - name: install.sh refuses a release whose signature was REMOVED
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/nosig"; mkdir -p "$W/bin" "$W/rel" "$W/payload"
          BASE=https://github.com/holland-built/bloxsmith/releases/latest/download
          curl -fsSLo "$W/rel/checksums.txt" "$BASE/checksums.txt"
          NUM="$(sed -n 's/.*bloxsmith_\([0-9][^_]*\)_.*/\1/p' "$W/rel/checksums.txt" | head -1)"
          # A forged archive that really does contain a runnable "bloxsmith".
          printf '#!/bin/sh\necho FORGED\n' > "$W/payload/bloxsmith"
          chmod +x "$W/payload/bloxsmith"
          tar -czf "$W/rel/bloxsmith_${NUM}_linux_amd64.tar.gz" -C "$W/payload" bloxsmith
          NEW="$(sha256sum "$W/rel/bloxsmith_${NUM}_linux_amd64.tar.gz" | awk '{print $1}')"
          awk -v s="$NEW" -v f="bloxsmith_${NUM}_linux_amd64.tar.gz" \
            '{ if ($2==f) print s"  "f; else print }' "$W/rel/checksums.txt" > "$W/t" && mv "$W/t" "$W/rel/checksums.txt"
          # ...and no checksums.txt.sshsig / .ed25519 in $W/rel at all.
          printf '%s\n' '#!/bin/sh' 'out=""; url=""' \
            'while [ $# -gt 0 ]; do case "$1" in -*o) out="$2"; shift 2;; -*) case "$1" in *o) out="$2"; shift 2;; *) shift;; esac;; *) url="$1"; shift;; esac; done' \
            'f="$(basename "$url")"; [ -f "$REL/$f" ] || exit 22; cp "$REL/$f" "$out"' > "$W/bin/curl"
          chmod +x "$W/bin/curl"
          if PATH="$W/bin:$PATH" REL="$W/rel" bash scripts/install.sh --prefix "$W/out" --no-service > "$W/nosig.log" 2>&1; then
            echo "::error::install.sh installed a forged archive from a release with NO signature"
            cat "$W/nosig.log"; exit 1
          fi
          if [ -x "$W/out/bloxsmith" ]; then
            echo "::error::a binary was installed despite the refusal"; exit 1
          fi
          grep -qi "no signature" "$W/nosig.log" || {
            echo "::error::the refusal did not say the signature was missing"; cat "$W/nosig.log"; exit 1; }
          echo "unsigned release refused, and nothing was installed"

      # THE ED25519 FALLBACK, which nothing else executes.
      #
      # install.sh prefers checksums.txt.sshsig (ssh-keygen -Y verify) and falls
      # back to the raw checksums.txt.ed25519 (openssl pkeyutl -rawin). Every
      # other step installs `latest`, which carries BOTH — so the preferred path
      # runs every time and the fallback runs never.
      #
      # The fallback is a LIVE path for current releases, not a legacy one: it is
      # what verifies the signature on a host with no usable ssh-keygen (slim
      # containers, busybox images) or when the sshsig asset cannot be fetched.
      # It used to be the only way to verify a pre-sshsig release too, and this
      # step used to install one (v3.23.2) to reach it — but that release has
      # been pruned and every surviving release carries both assets, so there is
      # no longer any release that takes this branch on its own.
      #
      # So the branch is FORCED instead of found: the real release assets are
      # mirrored to disk, the sshsig copy is deleted, and a curl shim on PATH
      # serves that directory, returning 22 (what a real 404 returns) for the
      # asset that is gone. Everything else is the genuine published release, so
      # what gets checked is a real signature against the key pinned in the
      # script — not a fixture. The shim is the same technique as the two steps
      # above, in its own workdir so they cannot collide.
      #
      # It is also the ONLY test of --version, the documented rollback flag, and
      # it points that flag at the OLDEST release still on GitHub — resolved from
      # the API at run time, never pinned, because releases past the newest ten
      # get pruned and a pinned tag here is exactly what broke this step before.
      - name: install.sh verifies the ed25519 fallback, and --version rollback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/ed25519"; mkdir -p "$W/bin" "$W/rel"
          TAG="$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
                   "https://api.github.com/repos/holland-built/bloxsmith/releases?per_page=100" \
                 | jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
                 | sort -V | head -1)"
          [ -n "$TAG" ] || { echo "::error::could not resolve the oldest surviving release"; exit 1; }
          NUM="${TAG#v}"
          echo "oldest release still published: $TAG"
          BASE="https://github.com/holland-built/bloxsmith/releases/download/$TAG"
          for f in checksums.txt checksums.txt.sshsig checksums.txt.ed25519 \
                   "bloxsmith_${NUM}_linux_amd64.tar.gz"; do
            curl -fsSLo "$W/rel/$f" "$BASE/$f" || {
              echo "::error::could not mirror $f from $TAG"; exit 1; }
          done
          # Fetched, then deleted: if $TAG ever stops publishing an sshsig the
          # fetch above fails loudly, rather than this step quietly "forcing" a
          # fallback that was already the only path.
          rm -f "$W/rel/checksums.txt.sshsig"
          printf '%s\n' '#!/bin/sh' 'out=""; url=""' \
            'while [ $# -gt 0 ]; do case "$1" in -*o) out="$2"; shift 2;; -*) case "$1" in *o) out="$2"; shift 2;; *) shift;; esac;; *) url="$1"; shift;; esac; done' \
            'f="$(basename "$url")"; [ -f "$REL/$f" ] || exit 22; cp "$REL/$f" "$out"' > "$W/bin/curl"
          chmod +x "$W/bin/curl"

          out="$(PATH="$W/bin:$PATH" REL="$W/rel" \
                 bash scripts/install.sh --version "$TAG" --prefix "$W/out" --no-service 2>&1)"
          code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::install.sh could not install $TAG — the rollback path is broken"; exit 1
          fi
          # It must have verified, and specifically via the ed25519 branch. A
          # "signature: ok (ssh-ed25519...)" here would mean the sshsig was served
          # after all, so the step is not exercising the fallback and proves
          # nothing about it.
          case "$out" in
            *"signature: ok (ed25519,"*) echo "the ed25519 fallback verified $TAG" ;;
            *"signature: ok (ssh-ed25519"*)
              echo "::error::the sshsig path ran — the fallback was not exercised"
              exit 1 ;;
            *)  echo "::error::$TAG installed WITHOUT a verified signature"; exit 1 ;;
          esac
          grep -q "checksum : ok" <<<"$out" || { echo "::error::checksum was not verified"; exit 1; }
          # Plain stdout: every surviving release postdates v3.30.1, which moved
          # --version off Go's builtin println (STDERR) onto stdout. Reading
          # stdout alone therefore also pins that fix for the oldest release we
          # still ship, alongside go/versionstream_test.go at the unit level.
          v="$("$W/out/bloxsmith" --version)"
          case "$v" in
            "bloxsmith $NUM") echo "and the pinned version is the one installed: $v" ;;
            *) echo "::error::--version $TAG installed '$v'"; exit 1 ;;
          esac

      # `bloxsmith update --check` had no test that ran the COMMAND. checkUpdate is
      # covered by four Go tests, but the CLI dispatch around it -- flag parsing,
      # the message, the exit code -- was not, and that is the layer v3.30.1's bug
      # lived in for the vault-passphrase command.
      - name: bloxsmith update --check reports against the real release feed
        run: |
          set -uo pipefail
          BIN="$RUNNER_TEMP/bx/bloxsmith"
          out="$("$BIN" update --check 2>&1)"; code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error::update --check exited $code"; exit 1
          fi
          # It must reach a DEFINITE verdict. Deliberately not asserting "up to
          # date" specifically: a push to master and its release tag land within
          # seconds of each other, so `latest` can legitimately change between
          # install.sh fetching it and this step asking — and a gate that goes red
          # because the project shipped is a gate people learn to ignore.
          #
          # Both verdicts are real answers. What this catches is the failure that
          # is not a verdict at all: a crash, an unparsed flag, a rate-limited or
          # unreachable API reported as up-to-date, or an error string where the
          # answer should be. That distinction is exactly what the four
          # TestCheckUpdate_* Go tests pin at the unit level.
          case "$out" in
            *"up to date"*)       echo "verdict: up to date" ;;
            *"update available"*) echo "verdict: update available (a release landed during this run)" ;;
            *)  echo "::error::update --check reached no verdict at all — got: $out"
                exit 1 ;;
          esac
          case "$out" in
            *error*|*Error*|*failed*) echo "::error::update --check reported an error: $out"; exit 1 ;;
          esac
          # --check must not have replaced the binary. A "check" that applies is the
          # worst possible reading of the flag.
          "$BIN" --version || { echo "::error::the binary is broken after --check"; exit 1; }

      # install.sh --uninstall was never run. install.ps1's uninstall IS tested on
      # Windows; the shell one was not, and it is the path that shells out to
      # `bloxsmith service uninstall` and deletes files.
      - name: install.sh --uninstall removes the binary and templates, keeps config
        run: |
          set -uo pipefail
          PREFIX="$RUNNER_TEMP/bx"
          CFG="${XDG_CONFIG_HOME:-$HOME/.config}/bloxsmith"
          mkdir -p "$CFG"
          echo "PORT=8080" > "$CFG/.env"

          out="$(bash scripts/install.sh --uninstall --prefix "$PREFIX" 2>&1)"; code=$?
          echo "$out"
          if [ "$code" -ne 0 ]; then echo "::error::--uninstall exited $code"; exit 1; fi
          if [ -e "$PREFIX/bloxsmith" ]; then
            echo "::error::the binary is still at $PREFIX/bloxsmith after --uninstall"; exit 1
          fi
          if [ -d "$PREFIX/templates" ]; then
            echo "::error::templates/ still present after --uninstall"; exit 1
          fi
          # Without --purge the config MUST survive: it holds the vault passphrase
          # and the API key, and a vault whose passphrase was deleted by an
          # uninstall is unopenable for good.
          if [ ! -f "$CFG/.env" ]; then
            echo "::error::--uninstall deleted $CFG/.env without --purge"; exit 1
          fi
          echo "uninstalled; config left in place, as it must be"

  # PSScriptAnalyzer gate for the Windows installer — catches PowerShell errors
  # without a manual Windows run. Error severity only; warnings don't fail CI.
  lint-ps1:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PSScriptAnalyzer (Error severity gate)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error
          if ($findings) {
            $findings | Format-Table RuleName, Line, Message -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no Error-severity findings in scripts/install.ps1"

  # PSScriptAnalyzer only PARSES install.ps1 — it never runs it. v3.23.0 shipped
  # a shell-side installer (install.sh) that was parse-clean and still broken:
  # a mangled assignment turned the checksum lookup into a command invocation.
  # `bash -n` didn't catch that because it was valid syntax, just wrong — the
  # only check that catches that class of bug is actually running the script.
  # This job is the PowerShell equivalent of the install-sh job above: it runs
  # scripts/install.ps1 for real on Windows, once as a genuine install against
  # the real latest release, and twice more as a refusal test against a local,
  # deliberately-tampered release, mirroring the two attacks install-sh guards
  # against (a corrupted checksums.txt, and a signature that was removed).
  install-ps1:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ssh-keygen -Y verify needs OpenSSH >= 8.0. windows-latest is assumed to
      # ship a recent-enough OpenSSH client, but that assumption has never been
      # confirmed here — log both tools' versions so the assumption is recorded
      # instead of silently believed. Never fail the job on this: it is a record,
      # not a gate (the install/refusal steps below are the real gate).
      # Windows PowerShell 5.1 decodes a BOM-less file as the ANSI codepage
      # (Windows-1252), NOT UTF-8. A UTF-8 em-dash then becomes three chars, one
      # of which is a CURLY DOUBLE QUOTE -- and PowerShell treats curly quotes as
      # real string delimiters. That silently unbalances the quoting and the
      # parser dies on some unrelated line far away. It is invisible on macOS and
      # to PSScriptAnalyzer (which reads the file as UTF-8), and it was sitting in
      # this file from the day it was written; nothing had ever executed it.
      # Keep the installer pure ASCII rather than relying on every tool that
      # copies it preserving a BOM.
      - name: install.ps1 is pure ASCII (PS 5.1 misreads UTF-8 without a BOM)
        shell: pwsh
        run: |
          $fail = $false
          foreach ($f in @('scripts/install.ps1', 'scripts/ci/Test-InstallRefusal.ps1')) {
            $bytes = [System.IO.File]::ReadAllBytes($f)
            $bad = @()
            $line = 1
            foreach ($b in $bytes) {
              if ($b -eq 10) { $line++ }
              elseif ($b -gt 127) { $bad += $line }
            }
            if ($bad.Count -gt 0) {
              $u = ($bad | Sort-Object -Unique) -join ', '
              Write-Host "::error::${f} contains non-ASCII bytes on line(s) $u - PowerShell 5.1 will mis-decode them and may fail to parse the file"
              $fail = $true
            } else {
              Write-Host "$f is pure ASCII ($($bytes.Length) bytes)"
            }
          }
          if ($fail) { exit 1 }

      # A precise parse check. The step below runs the installer as a child
      # process, and a child's parse error reaches us only as a truncated
      # fragment -- the first attempt reported "install.ps1:460 char:67" with the
      # actual message swallowed. Parsing here names the problem directly.
      - name: install.ps1 parses under Windows PowerShell
        shell: powershell
        run: |
          $bad = $false
          foreach ($f in @('scripts\install.ps1', 'scripts\ci\Test-InstallRefusal.ps1')) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f).Path, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              foreach ($e in $errors) {
                Write-Host "::error::${f}: parse error at line $($e.Extent.StartLineNumber) col $($e.Extent.StartColumnNumber): $($e.Message)"
              }
              $bad = $true
            } else {
              Write-Host "$f parses clean"
            }
          }
          if ($bad) { exit 1 }

      - name: Record ssh/ssh-keygen versions (assumption, not yet confirmed)
        shell: powershell
        continue-on-error: true
        run: |
          Write-Host "-- ssh -V --"
          ssh -V 2>&1 | Write-Host
          Write-Host "-- ssh-keygen -Y verify (usage line only, no real args) --"
          ssh-keygen -Y verify 2>&1 | Select-Object -First 1 | Write-Host

      # Run as a CHILD process (not dot-sourced) so its exit code is capturable
      # in $LASTEXITCODE / the process exit code, and tee output to a log file
      # so the assertions below can grep it. GitHub Actions sets CI=true, which
      # is what the script's launch gate keys on to skip opening a browser /
      # starting the app — so this step also exercises that gate, not just the
      # download+verify+install path.
      # Run the installer and assert in ONE step, holding the output in a
      # variable. Splitting them meant tee-ing to a file and re-reading it in a
      # later step, and that handoff silently lost lines: 'checksum : ok' was
      # reported absent from a log the console had visibly printed. Capturing
      # once removes the file, its encoding, and the cross-step handoff.
      - name: install.ps1 installs the latest release, verifying both times
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $prefix = "$env:RUNNER_TEMP\bx"
          $out = & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Prefix $prefix 2>&1 |
                   ForEach-Object { $_.ToString() }
          $code = $LASTEXITCODE
          $text = ($out -join "`n")
          Write-Host "--- installer output ---"
          Write-Host $text
          Write-Host "--- end installer output ---"

          if ($code -ne 0) {
            Write-Host "::error::install.ps1 exited $code on a clean install of the real latest release"
            exit 1
          }
          # Both verification lines must have actually PRINTED. A verify step
          # that silently stops running still looks like a clean install.
          foreach ($needle in @('signature: ok', 'checksum : ok')) {
            if ($text -notmatch [regex]::Escape($needle)) {
              Write-Host "::error::the installer succeeded but never printed '$needle' - verification did not run"
              exit 1
            }
          }
          $exe = Join-Path $prefix 'bloxsmith.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            Write-Host "::error::bloxsmith.exe is missing at $exe despite a zero exit code"
            exit 1
          }
          $ver = (& $exe --version 2>&1 | ForEach-Object { $_.ToString() }) -join ' '
          if ($ver -notmatch '^bloxsmith \d+\.\d+\.\d+') {
            Write-Host "::error::bloxsmith.exe --version did not match '^bloxsmith N.N.N' - got: $ver"
            exit 1
          }
          # Prove the PATH entry was added, so the uninstall assertion means something.
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (-not $userPath -or (($userPath -split ';') -notcontains $prefix)) {
            Write-Host "::error::install.ps1 did not add $prefix to the user PATH"
            exit 1
          }
          Write-Host "installed, both verifications printed, exe runs, PATH updated"

      # The refusal logic lives in a committed script, not inline here: the same
      # PowerShell embedded in YAML failed to parse twice, and each attempt cost
      # a CI round trip to find out. As a file it is covered by the parse check
      # above, so a syntax error fails in seconds.
      - name: install.ps1 refuses a tampered checksums.txt
        shell: powershell
        run: .\scripts\ci\Test-InstallRefusal.ps1 -Case tampered

      - name: install.ps1 refuses a release whose signature was REMOVED
        shell: powershell
        run: .\scripts\ci\Test-InstallRefusal.ps1 -Case nosig

      - name: install.ps1 -Uninstall removes the binary and the PATH entry
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = "$env:RUNNER_TEMP\bx"
          $log = "$env:RUNNER_TEMP\uninstall.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\install.ps1 -Uninstall -Prefix $prefix 2>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::install.ps1 -Uninstall exited $LASTEXITCODE"
            exit 1
          }
          if (Test-Path -LiteralPath "$prefix\bloxsmith.exe") {
            Write-Host "::error::bloxsmith.exe still exists at $prefix\bloxsmith.exe after -Uninstall"
            exit 1
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -and (($userPath -split ';') -contains $prefix)) {
            Write-Host "::error::$prefix is still on the user PATH after -Uninstall"
            exit 1
          }
          Write-Host "uninstall removed bloxsmith.exe and the PATH entry"

  # The Playwright suite, which nothing had ever run in CI. 48 spec files,
  # ~422 assertions; scripts/e2e.sh builds THIS tree and serves it on its own
  # port with throwaway state and blanked credentials. E2E_SKIP_LIVE=1 skips
  # the seven spec files that assert on data only a live Infoblox tenant
  # serves (list and measurement: playwright.config.ts) — ~390 assertions
  # still run. Local, with real credentials: `bash scripts/e2e.sh` runs all of
  # them. workers:1 is load-bearing (see playwright.config.ts), so this job is
  # long; measured 75 min for the full suite on a dev laptop, so the timeout
  # is generous rather than tight.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Install Playwright runner
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the e2e suite against a fresh build of this tree
        run: E2E_SKIP_LIVE=1 bash scripts/e2e.sh

      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 14
