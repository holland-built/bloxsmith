name: CI

# Replaces the retired docker-publish.yml. Builds and tests the Go single-binary
# app (embedded UI) — no image publish, no signing. Releases are cut by the
# tag-triggered .github/workflows/release.yml; this workflow proves the tree
# builds on push/PR.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # UI freshness: fail if go/web/app.bundle.js is stale vs src/*.jsx.
      - name: UI dist up to date (vite build --check)
        run: |
          cd ui && npm ci && npm run build && cd ..
          diff -r ui/dist go/web >/dev/null || {
            echo "::error::go/web is stale — run: cd ui && npm run build && rm -rf ../go/web/* && cp -R dist/* ../go/web/"
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go/go.sum

      - name: Go build + test
        working-directory: go
        run: |
          go build ./...
          go test ./...

      # Embedded-UI + multi-arch smoke: cross-compile every target, no publish.
      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: goreleaser build (snapshot, no publish)
        working-directory: go
        run: goreleaser build --snapshot --clean

  # install.sh had NO test at all, and it showed: v3.23.0 shipped with a mangled
  # `EXPECTED="$(...)"` assignment that turned the checksum lookup into a command
  # invocation. `bash -n` passes on that — it is valid syntax, just wrong — so the
  # only check that catches it is running the thing. This job installs the real
  # latest release and asserts BOTH verification lines actually printed: a
  # verification step that silently stops running is worse than none, because the
  # output still looks like a clean install.
  install-sh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: shellcheck (Error severity gate)
        run: shellcheck -S error scripts/install.sh

      - name: install.sh installs the latest release, verifying both times
        run: |
          set -euo pipefail
          bash scripts/install.sh --prefix "$RUNNER_TEMP/bx" | tee "$RUNNER_TEMP/install.log"
          grep -q "signature: ok" "$RUNNER_TEMP/install.log" || {
            echo "::error::install.sh did not verify the release signature"; exit 1; }
          grep -q "checksum : ok" "$RUNNER_TEMP/install.log" || {
            echo "::error::install.sh did not verify the checksum"; exit 1; }
          "$RUNNER_TEMP/bx/bloxsmith" --version

      # The refusal paths matter more than the happy one: a check that cannot
      # fail is decoration. A curl shim serves the real release assets from disk
      # so the archive can be validated against a checksums.txt we have edited.
      - name: install.sh refuses a tampered or unsigned checksums.txt
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/shim"; mkdir -p "$W/bin" "$W/rel"
          BASE=https://github.com/holland-built/bloxsmith/releases/latest/download
          for f in checksums.txt checksums.txt.ed25519; do
            curl -fsSLo "$W/rel/$f" "$BASE/$f"
          done
          NUM="$(sed -n 's/.*bloxsmith_\([0-9][^_]*\)_.*/\1/p' "$W/rel/checksums.txt" | head -1)"
          curl -fsSLo "$W/rel/bloxsmith_${NUM}_linux_amd64.tar.gz" \
            "$BASE/bloxsmith_${NUM}_linux_amd64.tar.gz"
          printf '%s\n' '#!/bin/sh' 'out=""; url=""' \
            'while [ $# -gt 0 ]; do case "$1" in -*o) out="$2"; shift 2;; -*) case "$1" in *o) out="$2"; shift 2;; *) shift;; esac;; *) url="$1"; shift;; esac; done' \
            'f="$(basename "$url")"; [ -f "$REL/$f" ] || exit 22; cp "$REL/$f" "$out"' > "$W/bin/curl"
          chmod +x "$W/bin/curl"

          sed -i 's/^./f/' "$W/rel/checksums.txt"
          if PATH="$W/bin:$PATH" REL="$W/rel" bash scripts/install.sh --prefix "$W/out" > "$W/tampered.log" 2>&1; then
            echo "::error::install.sh installed from a tampered checksums.txt"; cat "$W/tampered.log"; exit 1
          fi
          grep -q "SIGNATURE DOES NOT VERIFY" "$W/tampered.log" || {
            echo "::error::the refusal did not name the signature as the reason"; cat "$W/tampered.log"; exit 1; }
          echo "tampered checksums.txt refused, as it must be"

      # THE ACTUAL ATTACK, and the one v3.23.1 was vulnerable to: an attacker who
      # can write release assets replaces the archive, rewrites checksums.txt to
      # match it, and DELETES the signature files. The shipped v3.23.1 installer
      # printed "signature: none published for this release — checksum only",
      # then "checksum : ok", then installed the attacker's binary. Verified by
      # hand against the real release before the fix. A signature that only
      # protects you while the attacker leaves it in place protects nobody.
      - name: install.sh refuses a release whose signature was REMOVED
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/nosig"; mkdir -p "$W/bin" "$W/rel" "$W/payload"
          BASE=https://github.com/holland-built/bloxsmith/releases/latest/download
          curl -fsSLo "$W/rel/checksums.txt" "$BASE/checksums.txt"
          NUM="$(sed -n 's/.*bloxsmith_\([0-9][^_]*\)_.*/\1/p' "$W/rel/checksums.txt" | head -1)"
          # A forged archive that really does contain a runnable "bloxsmith".
          printf '#!/bin/sh\necho FORGED\n' > "$W/payload/bloxsmith"
          chmod +x "$W/payload/bloxsmith"
          tar -czf "$W/rel/bloxsmith_${NUM}_linux_amd64.tar.gz" -C "$W/payload" bloxsmith
          NEW="$(sha256sum "$W/rel/bloxsmith_${NUM}_linux_amd64.tar.gz" | awk '{print $1}')"
          awk -v s="$NEW" -v f="bloxsmith_${NUM}_linux_amd64.tar.gz" \
            '{ if ($2==f) print s"  "f; else print }' "$W/rel/checksums.txt" > "$W/t" && mv "$W/t" "$W/rel/checksums.txt"
          # ...and no checksums.txt.sshsig / .ed25519 in $W/rel at all.
          printf '%s\n' '#!/bin/sh' 'out=""; url=""' \
            'while [ $# -gt 0 ]; do case "$1" in -*o) out="$2"; shift 2;; -*) case "$1" in *o) out="$2"; shift 2;; *) shift;; esac;; *) url="$1"; shift;; esac; done' \
            'f="$(basename "$url")"; [ -f "$REL/$f" ] || exit 22; cp "$REL/$f" "$out"' > "$W/bin/curl"
          chmod +x "$W/bin/curl"
          if PATH="$W/bin:$PATH" REL="$W/rel" bash scripts/install.sh --prefix "$W/out" --no-service > "$W/nosig.log" 2>&1; then
            echo "::error::install.sh installed a forged archive from a release with NO signature"
            cat "$W/nosig.log"; exit 1
          fi
          if [ -x "$W/out/bloxsmith" ]; then
            echo "::error::a binary was installed despite the refusal"; exit 1
          fi
          grep -qi "no signature" "$W/nosig.log" || {
            echo "::error::the refusal did not say the signature was missing"; cat "$W/nosig.log"; exit 1; }
          echo "unsigned release refused, and nothing was installed"

  # PSScriptAnalyzer gate for the Windows installer — catches PowerShell errors
  # without a manual Windows run. Error severity only; warnings don't fail CI.
  lint-ps1:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: PSScriptAnalyzer (Error severity gate)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Error
          if ($findings) {
            $findings | Format-Table RuleName, Line, Message -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host "PSScriptAnalyzer: no Error-severity findings in scripts/install.ps1"
