name: Release

# Canonical release path: push a semver tag and CI runs goreleaser — GitHub
# Release (tarballs + checksums + install scripts), ghcr images (multi-arch,
# cosign keyless-signed), and — when the HOMEBREW_TAP_TOKEN secret is present —
# the Homebrew tap. Local goreleaser (docs/SHIP.md) remains the manual fallback.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push ghcr images with the built-in GITHUB_TOKEN (no PAT)
  id-token: write   # cosign keyless (OIDC) image signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # goreleaser needs full history + tags

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # go/web/ is committed + go:embed'd; prove it matches ui/ source (v3 Vite
      # stack — the retired no-build JSX pipeline lives on only in git history).
      - name: UI dist up to date (vite build --check)
        run: |
          cd ui && npm ci && npm run build && cd ..
          diff -r ui/dist go/web >/dev/null || {
            echo "::error::go/web is stale — run: cd ui && npm run build && rm -rf ../go/web/* && cp -R dist/* ../go/web/"
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # PINNED EXACTLY, not '1.26.x'. b14fe2b raised go.mod to 1.26.6 for four
          # reachable CVEs and asserted the workflows needed no change because
          # '1.26.x' resolves to the newest patch. That was WRONG and the next run
          # proved it: setup-go's version manifest lagged and installed 1.26.5,
          # and with GOTOOLCHAIN=local the job cannot fetch the newer toolchain
          # itself, so every Go job failed with "go.mod requires go >= 1.26.6
          # (running go 1.26.5)". The floating range and the local-toolchain
          # setting only work together while the manifest is current. Bump this
          # alongside go.mod.
          go-version: '1.26.6'
          cache-dependency-path: go/go.sum

      # Don't publish a tag that never passed tests: a tag can point at any
      # commit, not just a CI-green master. Gate the release on the suite.
      - name: Go build + test
        working-directory: go
        run: |
          go build ./...
          go test ./...

      - name: Set up QEMU (arm64 image build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # goreleaser's `sboms:` block does not bundle an SBOM generator — it shells
      # out to `syft`, and if syft is not on PATH the pipe fails and takes the
      # whole release with it. So this step is a hard prerequisite of publishing,
      # exactly like cosign above, and it sits next to it for that reason.
      #
      # The same install is repeated in ci.yml before its snapshot build. That is
      # deliberate duplication, not an oversight: without it, a syft installer
      # that broke — a moved release asset, a yanked tag, an action deprecation —
      # would first be discovered at `git push --tags`, with the tag already
      # created and the release half-published. On PRs it is a red X on a branch.
      - name: Install syft (goreleaser shells out to it for SBOMs)
        uses: anchore/sbom-action/download-syft@v0

      # Stage the installers into go/ so goreleaser's release.extra_files can
      # glob them without a `../` prefix (which its zglob rejects at publish
      # time). Kept out of git via .gitignore.
      - name: Stage installers for goreleaser extra_files
        run: cp scripts/install.sh scripts/install.ps1 go/

      - name: Set up goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      # Homebrew gating: the built-in GITHUB_TOKEN cannot push to the
      # holland-built/homebrew-tap repo. If the HOMEBREW_TAP_TOKEN secret (PAT,
      # repo scope on homebrew-tap) is present, release everything; if absent,
      # skip only the brew channel so the release never fails for lack of it.
      # Fail BEFORE publishing anything if the release signing key is missing.
      # Shipped binaries refuse to self-update to a release with no Ed25519
      # signature (go/signing.go), so an unsigned release is not a degraded
      # release — it is one nobody can update to. Better a loud CI failure than
      # a published tag that quietly strands every installed copy.
      - name: Release signing key present
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SSH_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SSH_SIGNING_KEY secret is not set — refusing to publish."
            echo "install.sh prefers the ssh-keygen signature because OpenSSH ships by"
            echo "default on macOS/Linux/Windows while OpenSSL 3.x does not; without this"
            echo "asset a stock Mac cannot verify the release at all."
            exit 1
          fi
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY secret is not set — refusing to publish an unsigned release."
            echo "Generate one with: cd go && go run ./tools/relsign keygen"
            echo "Store the private half: gh secret set RELEASE_SIGNING_KEY --repo ${{ github.repository }}"
            echo "and put the public half in go/signing.go before tagging."
            exit 1
          fi

      - name: goreleaser release
        working-directory: go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            goreleaser release --clean
          else
            echo "HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap publish"
            goreleaser release --clean --skip=homebrew
          fi

      # Sign checksums.txt with a key that does NOT live in the release, and
      # prove the signature verifies against the public key compiled into the
      # binaries before uploading it. The key reaches relsign through a file so
      # it never appears on a command line.
      - name: Sign and publish checksums.txt.ed25519
        working-directory: go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/relsign.key
          go run ./tools/relsign sign -key @/tmp/relsign.key \
            -in dist/checksums.txt -out dist/checksums.txt.ed25519
          PUB="$(sed -n 's/.*releaseSigningKey = "\([0-9a-f]*\)".*/\1/p' signing.go)"
          go run ./tools/relsign verify -pub "$PUB" \
            -in dist/checksums.txt -sig dist/checksums.txt.ed25519
          rm -f /tmp/relsign.key
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.ed25519 --clobber

      # SSH-format signature over the SAME checksums.txt. Separate from the raw
      # Ed25519 one on purpose: the compiled-in verifier in go/apply.go reads the
      # raw form with no dependencies, while the installers read this one because
      # ssh-keygen is present by default on macOS, Linux and Windows and OpenSSL
      # 3.x is not — macOS ships LibreSSL, which cannot verify raw Ed25519 at all.
      # A signature nobody on the platform can check is the control switched off.
      - name: Sign and publish checksums.txt.sshsig
        working-directory: go
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SSH_SIGNING_KEY: ${{ secrets.RELEASE_SSH_SIGNING_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$RELEASE_SSH_SIGNING_KEY" > /tmp/relsign_ssh
          chmod 600 /tmp/relsign_ssh
          # ssh-keygen -Y sign has no output flag: it always writes <file>.sig
          # next to its input. dist/checksums.txt.sig is ALREADY TAKEN by the
          # cosign signature goreleaser produced, so signing dist/checksums.txt
          # in place collides with it and ssh-keygen stops on an interactive
          # "Overwrite (y/n)?" prompt — which is exactly how this failed the
          # first time. Sign a copy outside dist/ instead; the signature covers
          # the file's contents, so a copy signs identically.
          cp dist/checksums.txt /tmp/sshsig_input
          ssh-keygen -Y sign -f /tmp/relsign_ssh -n bloxsmith-release /tmp/sshsig_input
          mv /tmp/sshsig_input.sig dist/checksums.txt.sshsig
          # Verify what we are about to publish, against the public key exactly as
          # install.sh pins it — a signing step that silently produced something
          # unverifiable would look identical to a good one.
          PUB="$(sed -n 's/.*SIG_SSH_PUBKEY="\(ssh-ed25519 [^"]*\)".*/\1/p' ../scripts/install.sh | head -1)"
          [ -n "$PUB" ] || { echo "::error::could not read the pinned ssh key from scripts/install.sh"; exit 1; }
          printf '%s %s\n' bloxsmith-release-signing "$(printf '%s' "$PUB" | awk '{print $1" "$2}')" > /tmp/allowed_signers
          ssh-keygen -Y verify -f /tmp/allowed_signers -I bloxsmith-release-signing \
            -n bloxsmith-release -s dist/checksums.txt.sshsig < dist/checksums.txt
          rm -f /tmp/relsign_ssh /tmp/allowed_signers /tmp/sshsig_input
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sshsig --clobber

      # The `sboms:` block in go/.goreleaser.yaml catalogs release ARCHIVES. The
      # pushed ghcr image was never covered by it and could not be: goreleaser's
      # sbom pipe runs during the archive phase, and dockers_v2 builds and pushes
      # the image afterwards, so at sbom time there is no image to read. README's
      # FIRST install path is `docker run`, which meant the most-used artifact
      # this project ships was the one with no ingredients list — the exact
      # inversion the SBOM work was supposed to fix.
      #
      # It runs HERE, last, for two reasons: `cosign attest` needs an image that
      # is already in the registry (it writes the attestation as a second tag
      # against the image's digest), and it needs the same OIDC token the
      # `docker_signs:` block used, which only exists inside this workflow.
      #
      # MULTI-ARCH IS THE PART THAT IS EASY TO GET WRONG. `ghcr.io/...:<tag>` is
      # an OCI *index* pointing at one manifest per platform, and `cosign attest`
      # has no `--recursive` (checked against the cosign docs — `cosign sign` has
      # one, `attest` does not). Attesting the index ref would therefore attach a
      # single SBOM to the whole list, and that SBOM would have been read from
      # exactly one architecture's image. Calling that "the image's SBOM" would
      # be a lie for the other architecture. So this enumerates the index's
      # children and attests EACH per-architecture digest with an SBOM read from
      # that same digest. `latest` and `<version>` resolve to the same index, so
      # both tags are covered by attesting the children once.
      #
      # The `unknown/unknown` filter is load-bearing and was watched to matter,
      # not assumed: rebuilding the same context with `--provenance=mode=max`
      # turns a 2-manifest index into a 4-manifest one whose two extra entries
      # are buildx attestation blobs with platform `unknown/unknown`. Without the
      # filter the count check below fails and syft gets pointed at a provenance
      # blob instead of an image.
      #
      # Nothing is attested to the index digest itself, deliberately. That is why
      # docs/DEPLOYMENT.md's verify recipe resolves the architecture digest
      # first: a bare `cosign verify-attestation ghcr.io/...:<tag>` finds nothing
      # and that is the honest answer, because no one SBOM is true for both
      # architectures.
      #
      # TWO predicates go on each digest. The image scan covers the Go module
      # graph AND the distroless base's own packages (measured locally against a
      # real 2-platform build of Dockerfile.goreleaser: 16 packages — the 9 Go
      # modules, `stdlib`, and base-files / media-types / netbase / tzdata /
      # tzdata-legacy with Debian versions, which the archive SBOMs never named).
      # It still cannot see the npm tree, because that is inside the same
      # //go:embed'd blob it is inside in the archives — so the UI SBOM produced
      # by the `ui-npm-sbom` entry is attached as a second spdxjson predicate to
      # the same digest. Together they are the whole image. Tell them apart by
      # `.predicate.name`: the image scan names itself after the image, the UI
      # one is `bloxsmith-ui-npm`.
      #
      # WHAT WAS PROVEN BEFORE COMMITTING, AND WHAT WAS NOT. This block was run
      # verbatim — extracted from this file, not retyped — against a real
      # two-platform build of Dockerfile.goreleaser pushed to a throwaway
      # `registry:2`, with a stub `cosign` on PATH that recorded every argv,
      # stored each `--predicate` file per digest, and replayed them as in-toto
      # DSSE envelopes on verify-attestation. Green: four attest calls, two per
      # digest, then one verify per digest finding both predicates. Five
      # refusals were watched rather than assumed, each exiting 1 with its own
      # message: a single-platform tag (a plain manifest with no `.manifests`
      # key), the `unknown/unknown` filter deleted (4 manifests vs the 2
      # .goreleaser.yaml declares), the image renamed out of .goreleaser.yaml,
      # no UI SBOM in dist/, and a stub that silently dropped the UI predicate
      # so only one attestation came back.
      #
      # What a stub CANNOT prove is the half that needs Fulcio and Rekor: that
      # the OIDC token is accepted, that the attestation is really written to
      # the registry, and that a genuine `cosign verify-attestation` finds and
      # cryptographically checks it. Nothing in ci.yml can prove it either —
      # that workflow has no `id-token: write` and pushes no images, so an
      # assertion there could never pass and none was added. The first real tag
      # is the first time that half runs, which is exactly why the verify loop
      # is inside this step: it must go red on the tag rather than publish an
      # image everyone believes is attested.
      - name: SBOM attestation for the pushed ghcr images (every architecture)
        working-directory: go
        env:
          IMAGE: ghcr.io/holland-built/bloxsmith
          IDENTITY: '^https://github\.com/holland-built/bloxsmith/\.github/workflows/release\.yml@refs/tags/'
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"

          # Drift guard: this step hardcodes the repo it attests, so if
          # dockers_v2 is ever repointed somewhere else it must fail rather than
          # attest an image nobody publishes any more.
          grep -q "$IMAGE" .goreleaser.yaml || {
            echo "::error::$IMAGE no longer appears in .goreleaser.yaml — dockers_v2 images: was renamed and this step is attesting the wrong repository"
            exit 1; }

          # `|| true` is not sloppiness: a bare `$(ls dist/*...)` that matches
          # nothing exits non-zero, `set -e` kills the step on the assignment,
          # and the reader gets `ls: No such file or directory` instead of the
          # message below. Watched happen before this line was written this way.
          UI_SBOM=$(ls dist/*_ui_npm.sbom.json 2>/dev/null || true)
          [ -n "$UI_SBOM" ] && [ -s "$UI_SBOM" ] || {
            echo "::error::no UI npm SBOM in dist/ — the ui-npm-sbom entry in .goreleaser.yaml did not run, so there is nothing to attest the UI half of the image with"
            exit 1; }

          docker buildx imagetools inspect --raw "$IMAGE:$V" > /tmp/index.json
          if ! jq -e 'has("manifests")' /tmp/index.json >/dev/null; then
            echo "::error::$IMAGE:$V is a single image manifest, not a multi-arch index — dockers_v2 pushed one platform"
            cat /tmp/index.json; exit 1
          fi

          # Counted from .goreleaser.yaml rather than written here as a number.
          # A hardcoded 2 would keep passing on the day a third platform is added
          # and quietly leave it unattested. `- linux/...` appears only in
          # dockers_v2's platforms: list (`builds.goos` is `- linux`, no slash).
          WANT=$(grep -cE '^ +- linux/' .goreleaser.yaml)
          jq -r '
            .manifests[]
            | select(.platform.os != "unknown" and .platform.architecture != "unknown")
            | "\(.digest) \(.platform.os)/\(.platform.architecture)"' /tmp/index.json > /tmp/children
          GOT=$(wc -l < /tmp/children | tr -d ' ')
          if [ "$GOT" -ne "$WANT" ]; then
            echo "::error::the pushed index has $GOT platform manifests, .goreleaser.yaml declares $WANT — some architecture would ship unattested"
            cat /tmp/index.json; exit 1
          fi
          echo "$GOT platform manifests, matching .goreleaser.yaml"

          # Read the child list on fd 3, not stdin: syft, cosign and docker all
          # inherit the loop's stdin, and one of them consuming a line would skip
          # an architecture silently — which is the single worst way this step
          # could fail, because the log would still look clean.
          while read -r DIGEST PLATFORM <&3; do
            ARCH="${PLATFORM#*/}"
            # /tmp, not dist/: dist/ is "what was published", and these are
            # written after checksums.txt was calculated and signed, so a copy
            # sitting there would be an SBOM outside the signed set. Its
            # published form is the attestation, which carries its own signature.
            OUT="/tmp/bloxsmith_${V}_image_${ARCH}.sbom.json"
            # Scanning the child digest (not the tag) is what makes this
            # per-architecture — no --platform flag needed, and no chance of
            # silently cataloguing the runner's own architecture twice.
            syft scan "registry:$IMAGE@$DIGEST" -o "spdx-json=$OUT" -q
            N=$(jq '.packages | length' "$OUT")
            jq -e '.packages[] | select(.name == "stdlib")' "$OUT" >/dev/null || {
              echo "::error::$OUT has no stdlib package — syft did not read the Go binary in $PLATFORM"; exit 1; }
            echo "$PLATFORM $DIGEST: $N packages"

            cosign attest --yes --type spdxjson --predicate "$OUT"     "$IMAGE@$DIGEST"
            cosign attest --yes --type spdxjson --predicate "$UI_SBOM" "$IMAGE@$DIGEST"
          done 3< /tmp/children

          # Read back what was just written. An attestation that failed to attach
          # looks exactly like one that worked from the outside, and this is the
          # only place in the whole pipeline where the real Fulcio/Rekor path
          # runs — a stub proved the argv, it cannot prove the registry accepted
          # anything.
          while read -r DIGEST PLATFORM <&3; do
            cosign verify-attestation --type spdxjson \
              --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer "$ISSUER" \
              "$IMAGE@$DIGEST" > /tmp/att.json
            # cosign writes the envelopes to stdout as newline-delimited JSON
            # (the human-readable verification summary goes to stderr). Pulled
            # out with a recursive select rather than a bare `.payload` so a
            # future cosign that wraps them in an array still parses — the
            # assertions below are the gate, and they must not go green because
            # the extraction silently produced nothing.
            jq -r '.. | objects | select(has("payload")) | .payload' /tmp/att.json > /tmp/payloads
            [ -s /tmp/payloads ] || {
              echo "::error::cosign verify-attestation returned no DSSE payloads for $PLATFORM"; cat /tmp/att.json; exit 1; }

            # Each line is one DSSE payload: base64 of an in-toto statement
            # wrapping the SPDX document. Decoded one at a time rather than as
            # one stream — concatenated padded base64 does not decode as a unit.
            # The assertions walk the decoded object with `..` instead of naming
            # a fixed path, so a change in how cosign nests the predicate turns
            # into a red release rather than a false pass on a document nobody
            # read.
            IMG=0; UI=0; TOTAL=0
            while read -r PAYLOAD <&4; do
              TOTAL=$((TOTAL + 1))
              printf '%s' "$PAYLOAD" | base64 -d > /tmp/pred.json
              if jq -e '[.. | objects | select(.name? == "bloxsmith-ui-npm")] | length >= 1' /tmp/pred.json >/dev/null; then
                UI=$((UI + 1))
                jq -e '[.. | objects | select(.name? == "react")] | length >= 1' /tmp/pred.json >/dev/null || {
                  echo "::error::the bloxsmith-ui-npm attestation on $PLATFORM does not list react — it is not the UI SBOM"; exit 1; }
              elif jq -e '[.. | objects | select(.name? == "stdlib")] | length >= 1' /tmp/pred.json >/dev/null; then
                IMG=$((IMG + 1))
              fi
            done 4< /tmp/payloads

            [ "$IMG" -ge 1 ] || {
              echo "::error::$PLATFORM has no image SBOM attestation ($TOTAL attestations back, none listing stdlib)"; exit 1; }
            [ "$UI" -ge 1 ] || {
              echo "::error::$PLATFORM has no bloxsmith-ui-npm attestation ($TOTAL back) — the UI npm tree is not attached to the image"; exit 1; }
            echo "$PLATFORM: $TOTAL attestations verified against the workflow's OIDC identity ($IMG image, $UI ui-npm)"
          done 3< /tmp/children

      # The image was never scanned for known vulnerabilities. ci.yml has run
      # govulncheck over the Go module since 2026-08-03 and `npm audit` over the
      # UI, so the two source trees were covered — but the artifact README's
      # first install path hands people, `docker run ghcr.io/...`, is a Go binary
      # PLUS a distroless base carrying its own Debian packages, and nothing had
      # ever looked at that base. The SBOM step above lists those packages; it
      # does not check any of them against an advisory database.
      #
      # WHY HERE AND NOT IN ci.yml. A ci.yml job could only scan an image built
      # from some earlier commit, because the image for THIS commit does not
      # exist until goreleaser has run a few steps above. That would report on an
      # artifact the pull request did not produce, which gates nothing. Scanning
      # right after publish is the only point where the bytes being scanned are
      # the bytes customers will pull. A failure here means a release that has to
      # be pulled — the correct severity for having shipped a known-vulnerable
      # image, and a much louder signal than a warning nobody reads.
      #
      # POLICY, deliberately narrower than govulncheck's. That one fails on ANY
      # reachable finding because it is call-graph aware and has no severity
      # field. Trivy is a version-range matcher over OS packages, so the same
      # rule would go red on unfixable transitive advisories and be switched off
      # within a week. This fails on HIGH/CRITICAL that HAVE A FIX
      # (--ignore-unfixed); anything else is reported in the log and does not
      # fail. If a finding is high, critical and fixable, the fix is a base image
      # or dependency bump — an action that exists, which is the test for whether
      # a gate deserves to block.
      #
      # A SCAN THAT COULD NOT RUN IS NOT A PASS. `exit-code: 1` covers findings;
      # a DB download failure, a rate limit or an unreadable image makes trivy
      # itself exit nonzero and fails this step too. Both outcomes are red on
      # purpose — a green tick for a scan that never happened is the worst
      # result available here.
      #
      # Trivy is pinned to 0.73.0, current stable, queried from the GitHub
      # releases API on 2026-08-12 rather than remembered. Same reasoning as the
      # govulncheck pin in ci.yml: with a floating scanner, a red build cannot be
      # attributed to a new advisory rather than a new tool.
      #
      # The vulnerability DATABASE is not pinned and must not be — a frozen
      # advisory list would make this theatre. Only the tooling is fixed.
      #
      # State when added, measured against the then-published image with this
      # exact trivy version and flags: 0 HIGH/CRITICAL in the debian 13.6 base
      # (5 packages) and 0 in the Go binary.
      # Run as a plain container rather than through aquasecurity/trivy-action.
      # The action passes severity, exit-code and ignore-unfixed as TRIVY_* env
      # vars written to a temp file, so its log line reads `Running Trivy with
      # options: trivy image <ref>` and the policy is invisible — there is no way
      # to confirm from a green run that the gate was actually applied. Spelled
      # out as flags, the log shows exactly what was enforced.
      #
      # THE TAG IS `${GITHUB_REF_NAME#v}`, NOT `${GITHUB_REF_NAME}`. goreleaser's
      # dockers_v2 tags with `{{ .Version }}`, which has no leading v, so the
      # image for tag v3.65.4 is `...:3.65.4`. The first version of this step got
      # that wrong and failed on v3.65.4 with `MANIFEST_UNKNOWN` — while the
      # identical `V="${GITHUB_REF_NAME#v}"` idiom sat 160 lines above it in the
      # SBOM step. Worth stating plainly: the failure was the step being wrong,
      # not the image being missing.
      - name: Scan the published image for known vulnerabilities (trivy)
        env:
          TRIVY_VERSION: 0.73.0
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/holland-built/bloxsmith:$V"
          echo "scanning $IMAGE"
          docker run --rm \
            -v /tmp/trivy-cache:/root/.cache/ \
            "aquasec/trivy:${TRIVY_VERSION}" image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              "$IMAGE"
