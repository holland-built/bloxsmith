<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fetched before the stylesheet asks for it; main.jsx waits for it before first draw.
         Only the Latin half: the other half of Inter loads when a page needs it. -->
    <link rel="preload" href="/src/assets/fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloxsmith</title>
    <script>
      try{var m=localStorage.getItem('theme');var d=m==='light'?false:m==='system'?(!window.matchMedia||matchMedia('(prefers-color-scheme:dark)').matches):true;document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','dark')}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
