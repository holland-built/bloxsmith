- main "Infra tab":
  - heading "Infrastructure" [level=1]
  - text: /Updated \d+:\d+ [AP]M/
  - paragraph: "Host and service health: hosts, jobs and DNS forwarding proxies."
  - list "Headline numbers":
    - listitem:
      - button "Hosts 3"
    - listitem:
      - button "Not online 1"
    - listitem:
      - button "Degraded 1"
    - listitem:
      - button "Unknown 0"
    - listitem:
      - link "Discovered assets 7":
        - /url: "#assets"
  - button "Arrange panels"
  - heading "Host Inventory" [level=2]
  - text: 3 hosts
  - textbox "Search name or IP":
    - /placeholder: Search name, IP…
  - combobox "Filter by type":
    - option "All types" [selected]
    - option "On site"
  - 'button "About: Host Inventory"': "About: ⓘ"
  - 'button "Options: Host Inventory"'
  - table:
    - rowgroup:
      - row "Name IP Status Type":
        - columnheader "Name":
          - button "Name"
        - columnheader "IP":
          - button "IP"
        - columnheader "Status":
          - button "Status"
        - columnheader "Type"
    - rowgroup:
      - row /baseline-host-a \d+\.\d+\.0\.2 Active On site/:
        - cell "baseline-host-a"
        - cell /\d+\.\d+\.0\.2/:
          - link /\d+\.\d+\.0\.2/:
            - /url: "#dossier?kind=address&q=10.10.0.2"
        - cell "Active"
        - cell "On site"
      - row /baseline-host-b \d+\.\d+\.0\.2 Degraded On site/:
        - cell "baseline-host-b"
        - cell /\d+\.\d+\.0\.2/:
          - link /\d+\.\d+\.0\.2/:
            - /url: "#dossier?kind=address&q=10.20.0.2"
        - cell "Degraded"
        - cell "On site"
      - row /baseline-host-c \d+\.\d+\.0\.2 Not online On site/:
        - cell "baseline-host-c"
        - cell /\d+\.\d+\.0\.2/:
          - link /\d+\.\d+\.0\.2/:
            - /url: "#dossier?kind=address&q=10.30.0.2"
        - cell "Not online"
        - cell "On site"
  - heading "Host Status" [level=2]
  - 'button "About: Host Status"': "About: ⓘ"
  - 'button "Options: Host Status"'
  - application "Host Status chart"
  - text: /3 hosts Active \d+% Degraded \d+% Not online \d+% CPU and memory, latest reading/
  - table:
    - rowgroup:
      - row "Host CPU Memory":
        - columnheader "Host"
        - columnheader "CPU"
        - columnheader "Memory"
    - rowgroup:
      - row /baseline-ns1 \d+% \d+%/:
        - cell "baseline-ns1"
        - cell /\d+%/
        - cell /\d+%/
      - row "baseline-ns2 5% not checked":
        - cell "baseline-ns2"
        - cell "5%"
        - cell "not checked"
  - text: "/DNS for all hosts together, last \\d+ hours: answer time \\d+ ms, timeouts \\d+ a second\\. Infoblox does not report these per host here\\./"
  - heading "Service Health" [level=2]
  - text: deployed services
  - 'button "About: Service Health"': "About: ⓘ"
  - 'button "Options: Service Health"'
  - text: DNS 2/2 online healthy DHCP 1 stopped · 1/2 up degraded Security only part of the list arrived unknown
  - heading "Host Apps" [level=2]
  - text: Infoblox Portal 1
  - 'button "About: Host Apps"': "About: ⓘ"
  - 'button "Options: Host Apps"'
  - table:
    - rowgroup:
      - row "Name Host ID Apps":
        - columnheader "Name"
        - columnheader "Host ID"
        - columnheader "Apps"
    - rowgroup:
      - row "baseline-onprem-a ophid-baseline-1 2":
        - cell "baseline-onprem-a"
        - cell "ophid-baseline-1"
        - cell "2"
  - heading "Jobs" [level=2]
  - text: recent 1
  - 'button "About: Jobs"': "About: ⓘ"
  - 'button "Options: Jobs"'
  - table:
    - rowgroup:
      - row "Created Type Status User":
        - columnheader "Created"
        - columnheader "Type"
        - columnheader "Status"
        - columnheader "User"
    - rowgroup:
      - row /Jan 1, \d+, 9:\d+ AM discovery completed baseline-operator/:
        - cell /Jan 1, \d+, 9:\d+ AM/
        - cell "discovery"
        - cell "completed"
        - cell "baseline-operator"
  - heading "DNS forwarding proxies" [level=2]
  - text: DFP, from Infoblox Portal 1
  - 'button "About: DNS forwarding proxies"': "About: ⓘ"
  - 'button "Options: DNS forwarding proxies"'
  - table:
    - rowgroup:
      - row "Name Status":
        - columnheader "Name"
        - columnheader "Status"
    - rowgroup:
      - row "baseline-dfp ok":
        - cell "baseline-dfp"
        - cell "ok"