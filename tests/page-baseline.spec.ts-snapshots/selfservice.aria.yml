- main "Get an address tab":
  - heading "Get an address" [level=1]
  - paragraph: Take the next free address from a subnet, or add a record to a DNS zone.
  - group "Task":
    - button "Get an address" [pressed]
    - button "Create a DNS record"
    - button "Change or delete records"
    - button "Give back an address"
  - region "Get an address":
    - heading "Get an address" [level=2]
    - group "IP Space":
      - text: ""
      - status
      - combobox "IP Space":
        - option "Select space…" [selected]
        - option /Baseline Space \(\d+ of \d+ addresses free\)/
    - group "Block":
      - text: ""
      - status
      - combobox "Block" [disabled]:
        - option "Any block" [selected]
    - group "Subnet":
      - text: ""
      - status
      - combobox "Subnet" [disabled]:
        - option "Select subnet…" [selected]
    - text: Count
    - spinbutton "Count": "1"
    - text: Name (optional)
    - textbox "Name (optional)":
      - /placeholder: e.g. host-01
    - checkbox "Also give it a DNS name"
    - text: Also give it a DNS name
    - checkbox "Lock it to one device (DHCP reservation)"
    - text: Lock it to one device (DHCP reservation)
    - button "Preview" [disabled]
    - text: To preview, pick an IP space.
  - region "Preview":
    - heading "Preview" [level=2]
    - paragraph: Pick a space and press Preview to see which address you would get. Nothing is taken until you press Allocate, which appears after Preview.
  - region "Made here":
    - heading "Made here" [level=2]
    - paragraph: Addresses, reservations and DNS names made on this page, newest first. Each delete asks first.
    - text: Nothing made here yet.