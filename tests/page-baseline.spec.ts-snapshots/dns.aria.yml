- main "DNS tab":
  - heading "DNS" [level=1]
  - text: /Updated \d+:\d+ [AP]M/
  - list "Headline numbers":
    - listitem:
      - button /DNS queries \d+ a second/
      - text: /Average for the hour from \d+:\d+ AM, so far\. No reading from this time yesterday to compare with\./
    - listitem:
      - link "Zones 1 with issues Review · of 2":
        - /url: "#dns?issues=1"
      - text: Zones whose cache times need fixing. Opens the list of them.
    - listitem:
      - button "Zone signing 1 not signed Review · of 2 public"
      - text: Zones with public names, such as .com, that are not signed against tampering. Internal zones (reverse, .local, .lab) need no signing and are not counted.
    - listitem:
      - button "DNS services 1"
      - text: DNS services on this tenant. Infoblox gives no up or down state, so this is a count, not a health check.
  - button "Arrange panels"
  - heading /DNS Query Rate — \d+[hmsp]+/ [level=2]
  - text: queries per second
  - 'button /About: DNS Query Rate — \d+[hmsp]+/': "About: ⓘ"
  - 'button /Options: DNS Query Rate — \d+[hmsp]+/'
  - text: /\d+/
  - application /DNS Query Rate — \d+[hmsp]+ chart/: /\d+:\d+ AM \d+:\d+ AM/
  - heading /DNS Answers — \d+[hmsp]+/ [level=2]
  - 'button /About: DNS Answers — \d+[hmsp]+/': "About: ⓘ"
  - 'button /Options: DNS Answers — \d+[hmsp]+/'
  - text: Average time to answer
  - term: All answers
  - definition: /\d+ ms/
  - term: From your own zones
  - definition: no readings
  - term: Asked elsewhere
  - definition: /\d+ ms/
  - text: How lookups ended
  - term: Answered from cache
  - definition: /\d+%/
  - term: Failed (SERVFAIL)
  - definition: 1.6%
  - term: Name not found (NXDOMAIN)
  - definition: /\d+%/
  - term: Timeouts
  - definition: /\d+ a second/
  - heading "Failed Lookups" [level=2]
  - combobox "Time window":
    - option "Today" [selected]
    - option "Yesterday"
    - option "This week"
    - option /Last \d+ days/
  - 'button "About: Failed Lookups"': "About: ⓘ"
  - 'button "Options: Failed Lookups"'
  - term: Failed lookups
  - definition: /\d+,\d+/
  - term: Name not found (NXDOMAIN)
  - definition: /\d+,\d+/
  - term: Server failed (SERVFAIL)
  - definition: /\d+/
  - term: Refused (REFUSED)
  - definition: /\d+/
  - term: Other
  - definition: "5"
  - text: /The \d+ names that failed most/
  - table:
    - rowgroup:
      - row "Name Failed":
        - columnheader "Name"
        - columnheader "Failed"
    - rowgroup:
      - row /missing\.baseline\.example\. \d+/:
        - cell "missing.baseline.example."
        - cell /\d+/
      - row /old-printer\.baseline\.example\. \d+/:
        - cell "old-printer.baseline.example."
        - cell /\d+/
  - text: Every number is for today, from the failed-lookup records.
  - heading "Zone problems" [level=2]
  - 'button "About: Zone problems"': "About: ⓘ"
  - 'button "Options: Zone problems"'
  - text: Issues by kind
  - list "Zone issues by kind":
    - listitem:
      - 'button "cache time too short: 1 zone. Show them."'
  - term: Forward
  - definition: "2"
  - term: Reverse
  - definition: "0"
  - term: Unusual settings
  - definition: "1"
  - heading "DNS Services" [level=2]
  - text: 1 service
  - 'button "About: DNS Services"': "About: ⓘ"
  - 'button "Options: DNS Services"'
  - table:
    - rowgroup:
      - row "Name Comment Server group":
        - columnheader "Name"
        - columnheader "Comment"
        - columnheader "Server group"
    - rowgroup:
      - row "baseline-dns-service baseline pool/baseline-1":
        - cell "baseline-dns-service"
        - cell "baseline"
        - cell "pool/baseline-1"
  - heading "Query Volume — 7d" [level=2]
  - 'button "About: Query Volume — 7d"': "About: ⓘ"
  - 'button "Options: Query Volume — 7d"'
  - application "Query Volume — 7d chart": /Dec \d+ Dec \d+ Dec \d+ Dec \d+ Dec \d+ Jan 1/
  - heading "DNS Zones" [level=2]
  - text: 2 zones
  - textbox "Filter zones":
    - /placeholder: Filter…
  - 'button "About: DNS Zones"': "About: ⓘ"
  - 'button "Options: DNS Zones"'
  - table:
    - rowgroup:
      - row "Zone View Records Cache time Issues":
        - columnheader "Zone":
          - button "Zone"
        - columnheader "View":
          - button "View"
        - columnheader "Records":
          - button "Records"
        - columnheader "Cache time":
          - button "Cache time"
        - columnheader "Issues":
          - button "Issues"
    - rowgroup:
      - row /other\.example\. baseline-view 3 \d+ cache time too short/:
        - cell "other.example.":
          - link "other.example.":
            - /url: "#dossier?kind=zone&q=other.example.&view=baseline-view&id=dns%2Fauth_zone%2Fbaseline-2"
        - cell "baseline-view"
        - cell "3"
        - cell /\d+/
        - cell "cache time too short"
      - row /baseline\.example\. baseline-view \d+ \d+ —/:
        - cell "baseline.example.":
          - link "baseline.example.":
            - /url: "#dossier?kind=zone&q=baseline.example.&view=baseline-view&id=dns%2Fauth_zone%2Fbaseline-1"
        - cell "baseline-view"
        - cell /\d+/
        - cell /\d+/
        - cell "—"
  - heading "Zone signing" [level=2]
  - text: DNSSEC 1 unsigned
  - 'button "About: Zone signing"': "About: ⓘ"
  - 'button "Options: Zone signing"'
  - term: Not signed
  - definition: "1"
  - term: Signed
  - definition: "1"
  - term: Signed share
  - definition: /\d+\.\d+%/
  - term: Internal
  - definition: "1"
  - table:
    - rowgroup:
      - row "Zone View":
        - columnheader "Zone"
        - columnheader "View"
    - rowgroup:
      - row "other.example. baseline-view":
        - cell "other.example.":
          - link "other.example.":
            - /url: "#dossier?kind=zone&q=other.example.&id=dns%2Fauth_zone%2Fbaseline-2"
        - cell "baseline-view"
  - heading "Blocklist zones" [level=2]
  - text: RPZ 1 zone
  - 'button "About: Blocklist zones"': "About: ⓘ"
  - 'button "Options: Blocklist zones"'
  - table:
    - rowgroup:
      - row "Zone Severity Override Type Status":
        - columnheader "Zone"
        - columnheader "Severity"
        - columnheader "Override"
        - columnheader "Type"
        - columnheader "Status"
    - rowgroup:
      - row "rpz.baseline.example. High None local Enabled":
        - cell "rpz.baseline.example."
        - cell "High"
        - cell "None"
        - cell "local"
        - cell "Enabled"
  - heading "Load-balanced names" [level=2]
  - text: DTC 1 name
  - 'button "About: Load-balanced names"': "About: ⓘ"
  - 'button "Options: Load-balanced names"'
  - table:
    - rowgroup:
      - row "Name Policy Precedence Cache time Status":
        - columnheader "Name"
        - columnheader "Policy"
        - columnheader "Precedence"
        - columnheader "Cache time"
        - columnheader "Status"
    - rowgroup:
      - row /baseline-lbdn baseline-policy \d+ \d+ Enabled/:
        - cell "baseline-lbdn":
          - link "baseline-lbdn":
            - /url: "#dossier?kind=address&q=baseline-lbdn"
        - cell "baseline-policy"
        - cell /\d+/
        - cell /\d+/
        - cell "Enabled"