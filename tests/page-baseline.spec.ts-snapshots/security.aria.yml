          - button "Severity"
        - columnheader "Query":
          - button "Query"
        - columnheader "Action":
          - button "Action"
        - columnheader "Time":
          - button "Time"
    - rowgroup:
      - row /Block HIGH bad\.baseline\.example BLOCK 1\/1\/\d+, \d+:\d+:\d+ AM/:
