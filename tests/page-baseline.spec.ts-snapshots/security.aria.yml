          - checkbox
        - cell "Block":
          - button "Block"
        - cell "HIGH"
        - cell "bad.baseline.example"
        - cell "BLOCK"
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
      - row /Block MEDIUM watch\.baseline\.example LOG 1\/1\/\d+, 8:\d+:\d+ AM/:
