- main "Changes tab":
  - heading "Changes" [level=1]
  - text: /Last \d+ hours only Updated .+/
  - button "Arrange panels"
  - heading "Worth a look" [level=2]
  - 'button "About: Worth a look"': "About: ⓘ"
  - 'button "Options: Worth a look"'
  - text: /Deletions Needs action 1\+ at least 1; older changes not checked Check it was meant Failed Needs action 1\+ at least 1; older changes not checked See why it failed Out of hours 2\+ \d+:\d+–\d+:\d+ local New accounts Unknown Not answered older changes not checked/
  - status: /Based on the newest \d+ changes; older ones weren't checked/
  - heading "Changed objects" [level=2]
  - 'button "About: Changed objects"': "About: ⓘ"
  - 'button "Options: Changed objects"'
  - text: /\d+ changes · \d+ objects · \d+:\d+:\d+–\d+:\d+:\d+ Deleted or failed Out of hours Everything else/
  - table "Changed objects, grouped by resource":
    - row "Severity Local time Action Result Who Type Flags":
      - columnheader "Severity"
      - columnheader "Local time"
      - columnheader "Action"
      - columnheader "Result"
      - columnheader "Who"
      - columnheader "Type"
      - columnheader "Flags"
    - rowgroup "IP address — 2 changes · 1 worked · 1 failed":
      - row "IP address 2 changes · 1 worked · 1 failed":
        - cell
        - rowheader "IP address":
          - heading "IP address" [level=3]
        - cell "2 changes · 1 worked · 1 failed"
      - 'row /Deleted or failed \d+-\d+-\d+:\d+:\d+ Changed Refused actor-gamma automated account Failed/':
        - cell "Deleted or failed"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "Changed"
        - cell "Refused"
        - cell "actor-gamma"
        - cell "automated account"
        - cell "Failed"
      - row /Out of hours \d+-\d+-\d+:\d+:\d+ Changed Worked actor-beta automated account Out of hours/:
        - cell "Out of hours"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "Changed"
        - cell "Worked"
        - cell "actor-beta"
        - cell "automated account"
        - cell "Out of hours"
    - rowgroup "Subnet — 1 change · 1 worked":
      - row "Subnet 1 change · 1 worked":
        - cell
        - rowheader "Subnet":
          - heading "Subnet" [level=3]
        - cell "1 change · 1 worked"
      - row /Routine \d+-\d+-\d+:\d+:\d+ Changed Worked actor-beta automated account/:
        - cell "Routine"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "Changed"
        - cell "Worked"
        - cell "actor-beta"
        - cell "automated account"
        - cell
    - rowgroup "DNS record — 1 change · 1 worked · 1 deleted":
      - row "DNS record 1 change · 1 worked · 1 deleted":
        - cell
        - rowheader "DNS record":
          - heading "DNS record" [level=3]
        - cell "1 change · 1 worked · 1 deleted"
      - row /Deleted or failed \d+-\d+-\d+:\d+:\d+ Deleted Worked actor-alpha automated account Deleted/:
        - cell "Deleted or failed"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "Deleted"
        - cell "Worked"
        - cell "actor-alpha"
        - cell "automated account"
        - cell "Deleted"
    - rowgroup "DNS zone — 1 change · 1 worked":
      - row "DNS zone 1 change · 1 worked":
        - cell
        - rowheader "DNS zone":
          - heading "DNS zone" [level=3]
        - cell "1 change · 1 worked"
      - row /Out of hours \d+-\d+-\d+:\d+:\d+ Changed Worked actor-alpha automated account Out of hours/:
        - cell "Out of hours"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "Changed"
        - cell "Worked"
        - cell "actor-alpha"
        - cell "automated account"
        - cell "Out of hours"
