- main "Changes tab":
  - heading "What changed" [level=1]
  - text: /Last \d+ h only Updated .+/
  - button "Arrange panels"
  - heading "Worth a look" [level=2]
  - 'button "About: Worth a look"': "About: ⓘ"
  - 'button "Options: Worth a look"'
  - text: /Deletions Look 1\+ older rows not read Failed Look 1\+ older rows not read Out of hours 2\+ \d+:\d+–\d+:\d+ local New accounts Unknown Not answered older rows not read/
  - status: /Only the \d+ most recent/
  - heading "Changed objects" [level=2]
  - 'button "About: Changed objects"': "About: ⓘ"
  - 'button "Options: Changed objects"'
  - text: /\d+ changes · \d+ objects · \d+:\d+:\d+–\d+:\d+:\d+/
  - table "Changed objects, grouped by resource":
    - row "Severity Local time Action Result Who Type Flags":
      - columnheader "Severity"
      - columnheader "Local time"
      - columnheader "Action"
      - columnheader "Result"
      - columnheader "Who"
      - columnheader "Type"
      - columnheader "Flags"
    - rowgroup "addressservice — 2 rows · 1 success · 1 not successful":
      - row "addressservice 2 rows · 1 success · 1 not successful":
        - cell
        - rowheader "addressservice":
          - heading "addressservice" [level=3]
        - cell "2 rows · 1 success · 1 not successful"
      - 'row /Critical \d+-\d+-\d+:\d+:\d+ UPDATE failed: denied actor-gamma service Failed/':
        - cell "Critical"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "UPDATE"
        - 'cell "failed: denied"'
        - cell "actor-gamma"
        - cell "service"
        - cell "Failed"
      - row /Out of hours \d+-\d+-\d+:\d+:\d+ UPDATE success actor-beta service Out of hours/:
        - cell "Out of hours"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "UPDATE"
        - cell "success"
        - cell "actor-beta"
        - cell "service"
        - cell "Out of hours"
    - rowgroup "subnetservice — 1 row · 1 success":
      - row "subnetservice 1 row · 1 success":
        - cell
        - rowheader "subnetservice":
          - heading "subnetservice" [level=3]
        - cell "1 row · 1 success"
      - row /Routine \d+-\d+-\d+:\d+:\d+ UPDATE success actor-beta service/:
        - cell "Routine"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "UPDATE"
        - cell "success"
        - cell "actor-beta"
        - cell "service"
        - cell
    - rowgroup "dnsrecord — 1 row · 1 success · 1 deleted":
      - row "dnsrecord 1 row · 1 success · 1 deleted":
        - cell
        - rowheader "dnsrecord":
          - heading "dnsrecord" [level=3]
        - cell "1 row · 1 success · 1 deleted"
      - row /Critical \d+-\d+-\d+:\d+:\d+ DELETE success actor-alpha service Deleted/:
        - cell "Critical"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "DELETE"
        - cell "success"
        - cell "actor-alpha"
        - cell "service"
        - cell "Deleted"
    - rowgroup "auth_zone — 1 row · 1 success":
      - row "auth_zone 1 row · 1 success":
        - cell
        - rowheader "auth_zone":
          - heading "auth_zone" [level=3]
        - cell "1 row · 1 success"
      - row /Out of hours \d+-\d+-\d+:\d+:\d+ UPDATE success actor-alpha service Out of hours/:
        - cell "Out of hours"
        - cell /\d+-\d+-\d+:\d+:\d+/
        - cell "UPDATE"
        - cell "success"
        - cell "actor-alpha"
        - cell "service"
        - cell "Out of hours"
