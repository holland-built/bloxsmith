- main "Build a chart tab":
  - heading "Build a chart" [level=1]
  - switch "Show cube names"
  - paragraph:
    - text: Pick what to count and how to slice it. The app writes the query from a fixed list, runs it on your Infoblox account and draws what comes back. No AI is involved, so every number is Infoblox's own.
    - button "Docs →"
  - button "Arrange panels"
  - heading "Choose" [level=2]
  - 'button "About: Choose"': "About: ⓘ"
  - 'button "Options: Choose"'
  - text: What to count
  - combobox "What to count":
    - option "DNS queries" [selected]
    - option "Security hits"
    - option "DNS queries per second"
    - option "DHCP lease changes"
  - text: Split by
  - combobox "Split by":
    - option "Device" [selected]
    - option "Record type"
    - option "Domain"
    - option "Answer"
    - option "Nothing, one total"
  - text: When
  - combobox "When":
    - option "Today"
    - option /Last \d+ hours/
    - option "Last 7 days" [selected]
    - option /Last \d+ days/
  - text: Over time
  - combobox "Over time":
    - option "No, one total" [selected]
  - text: How many
  - combobox "How many":
    - option "Top 5"
    - option /Top \d+/ [selected]
    - option /Top \d+/
  - heading /Top \d+ devices by DNS queries, last 7 days/ [level=2]
  - 'button /About: Top \d+ devices by DNS queries, last 7 days/': "About: ⓘ"
  - 'button /Options: Top \d+ devices by DNS queries, last 7 days/'
  - application "Your chart": baseline-ws-1 baseline-ws-2
  - heading "How this chart was made" [level=2]
  - 'button "About: How this chart was made"': "About: ⓘ"
  - 'button "Options: How this chart was made"'
  - paragraph:
    - text: Sent to
    - code: /api/cubejs/v1/query
    - text: on your Infoblox account. No AI was used.
  - term: Counted
  - definition: DNS queries
  - term: Split by
  - definition: Device
  - term: When
  - definition: Last 7 days
  - term: Showing
  - definition: /Top \d+, highest first/
  - group: The query as sent