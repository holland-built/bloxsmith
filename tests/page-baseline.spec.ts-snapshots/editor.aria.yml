- main "Editor tab":
  - heading "Editor" [level=1]
  - paragraph: Make, change or delete one DNS or DHCP item at a time.
  - button "DNS Zone"
  - button "Subnet"
  - button "Address Block"
  - button "DHCP Range"
  - button "Host"
  - button "Tags"
  - region "DNS Zone — Create":
    - heading "DNS Zone — Create" [level=2]
    - text: Change or delete an existing DNS zone
    - searchbox "Change or delete an existing DNS zone"
    - text: ID of an existing one (leave blank to make a new one)
    - textbox "ID of an existing one (leave blank to make a new one)":
      - /placeholder: existing object id — enables update/delete
    - text: Zone name *
    - textbox "Zone name *":
      - /placeholder: zone.example.com.
    - text: DNS view ID *
    - textbox "DNS view ID *":
      - /placeholder: view id
    - text: Comment
    - textbox "Comment":
      - /placeholder: ""
    - text: Tags (key=value, key2=value2)
    - textbox "Tags (key=value, key2=value2)":
      - /placeholder: env=prod,team=noc
    - button "Preview"
  - region "Preview":
    - heading "Preview" [level=2]
    - paragraph: Press Preview to see what would be sent. Nothing changes in Infoblox until you press Create.