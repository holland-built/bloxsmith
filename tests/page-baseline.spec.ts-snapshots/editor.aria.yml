- main "Editor tab":
  - heading "Editor" [level=1]
  - paragraph:
    - text: Direct create, update, and delete on individual DNS/DHCP objects. Blank Object ID creates; pasting an ID switches the form to update and reveals Delete. Preview first, then Apply. Editor-created subnets and address blocks are ad-hoc — no site template tracks them, so Drift reports them as extra.
    - button "Docs →"
