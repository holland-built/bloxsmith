- main "Editor tab":
  - heading "Editor" [level=1]
  - paragraph:
    - text: Make, change or delete one DNS or DHCP item at a time. Leave the ID box empty to make a new one; paste an existing item's ID to change it, which also shows Delete. Preview first, then Apply. Editor-created subnets and address blocks are ad-hoc — no site template tracks them, so Drift reports them as extra.
    - button "Docs →"
  - button "DNS Zone"
  - button "Subnet"
  - button "Address Block"
  - button "DHCP Range"
  - button "Host"
  - button "Tags"
  - heading "DNS Zone — Create" [level=2]
  - 'button "About: DNS Zone — Create"': "About: ⓘ"
  - 'button "Options: DNS Zone — Create"'
  - text: ID of an existing one (leave blank to make a new one)
  - textbox "ID of an existing one (leave blank to make a new one)":
