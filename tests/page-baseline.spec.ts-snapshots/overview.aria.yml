- main "Overview tab":
  - heading "Overview" [level=1]
  - text: /Updated \d+:\d+ PM/
  - region "Services at a glance":
    - button /DNS Healthy \d+ queries\/s ▲ \d+% vs \d+[hmsp]+ ago \d+ queries\/s · hourly average, last hour · 2\/2 online/ [pressed]
    - button "DHCP Look 1 active leases 1 of 2 up 1 active leases · of 2 leases loaded · 1 stopped · 1/2 up"
    - button /IPAM Look 1 subnets ≥\d+% of 3 1 of 3 subnets ≥\d+% · 0 more at \d+–\d+% · all subnets/
    - button "Hosts Act 1 not online of 3 1 of 3 not online · all hosts"
    - button "Security Act 3 critical or high 3 critical or high events · whole window · beyond the row cap"
  - region "DNS detail":
    - heading "DNS" [level=2]
    - text: /Last \d+ hours/
    - 'img /DNS queries per second, last \d+ hours: from \d+\.\d+ to \d+\.\d+/'
    - text: /\d+:\d+ AM \d+:\d+ AM \d+:\d+ AM \d+[hmsp]+ ago \d+[hmsp]+ ago Now \d+ queries\/s · hourly average, last hour · 2\/2 online/
    - link "Open DNS":
      - /url: "#dns"
  - region "Services":
    - heading "Services" [level=2]
    - button "Hide" [expanded]
    - region "Service board":
      - table:
        - rowgroup:
          - row /Service Now Open issues Last \d+ days State/:
            - columnheader "Service"
            - columnheader "Now"
            - columnheader "Open issues"
            - columnheader /Last \d+ days/
            - columnheader "State"
        - rowgroup:
          - row /DNS \d+ queries\/s none open Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1 healthy/:
            - rowheader "DNS":
              - link "DNS":
                - /url: "#dns"
            - cell /\d+ queries\/s/
            - cell "none open"
            - cell /Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1/
            - cell "healthy"
          - row /DHCP 1 active leases none open Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1 degraded/:
            - rowheader "DHCP":
              - link "DHCP":
                - /url: "#network?focus=leases"
            - cell "1 active leases"
            - cell "none open"
            - cell /Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1/
            - cell "degraded"
          - row /IPAM 1 subnets ≥\d+% none open Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1 Look/:
            - rowheader "IPAM":
              - link "IPAM":
                - /url: "#network?minUtil=90"
            - cell /1 subnets ≥\d+%/
            - cell "none open"
            - cell /Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1/
            - cell "Look"
          - 'row /Hosts 1 not online 1 of 3 hosts is not online Open: 1 of 3 hosts is not online Ask the AI: Which hosts are not online\? Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1 Act/':
            - rowheader "Hosts":
              - link "Hosts":
                - /url: "#infra?status=offline"
            - cell "1 not online"
            - 'cell "1 of 3 hosts is not online Open: 1 of 3 hosts is not online Ask the AI: Which hosts are not online?"':
              - list:
                - listitem:
                  - text: 1 of 3 hosts is not online
                  - 'link "Open: 1 of 3 hosts is not online"':
                    - /url: "#infra?status=offline"
                    - text: ""
                  - 'link "Ask the AI: Which hosts are not online?"':
                    - /url: "#ai?q=Which%20hosts%20are%20not%20online%3F"
                    - text: Ask why
            - cell /Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1/
            - cell "Act"
          - 'row /Security 3 critical or high 3 critical or high security events Open: 3 critical or high security events Ask the AI: Which domains are on threat feeds\? Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1 Act/':
            - rowheader "Security":
              - link "Security":
                - /url: "#security"
            - cell "3 critical or high"
            - 'cell "3 critical or high security events Open: 3 critical or high security events Ask the AI: Which domains are on threat feeds?"':
              - list:
                - listitem:
                  - text: 3 critical or high security events
                  - 'link "Open: 3 critical or high security events"':
                    - /url: "#security"
                    - text: ""
                  - 'link "Ask the AI: Which domains are on threat feeds?"':
                    - /url: "#ai?q=Which%20domains%20are%20on%20threat%20feeds%3F"
                    - text: Ask why
            - cell /Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1/
            - cell "Act"
          - 'row /Other 2 subnets close to full Open: 2 subnets close to full Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1 Look/':
            - rowheader "Other":
              - link "Other":
                - /url: "#incidents"
            - cell
            - 'cell "2 subnets close to full Open: 2 subnets close to full"':
              - list:
                - listitem:
                  - text: 2 subnets close to full
                  - 'link "Open: 2 subnets close to full"':
                    - /url: "#incidents"
                    - text: ""
            - cell /Tue, Dec \d+ Wed, Dec \d+ Thu, Dec \d+ Fri, Dec \d+ Sat, Dec \d+ Sun, Dec \d+ Mon, Dec \d+ Tue, Dec \d+ Wed, Dec \d+ Thu, Jan 1/
            - cell "Look"
  - heading "Charts" [level=2]
  - button "Arrange panels"
  - heading /DNS Query Rate — \d+[hmsp]+/ [level=2]:
    - button /DNS Query Rate — \d+[hmsp]+/
  - text: queries per second
  - 'button /About: DNS Query Rate — \d+[hmsp]+/': "About: ⓘ"
  - 'button /Options: DNS Query Rate — \d+[hmsp]+/'
  - text: /\d+ ▲ \d+\.\d+% vs first hour/
  - application /DNS Query Rate — \d+[hmsp]+ chart/: /\d+:\d+ AM \d+:\d+ AM/
  - heading "License Inventory" [level=2]
  - text: 0 licenses
  - 'button "About: License Inventory"': "About: ⓘ"
  - 'button "Options: License Inventory"'
  - text: no license data available