- main "Overview tab":
  - heading "Overview" [level=1]
  - paragraph: "/Inventory fetched \\d+:\\d+ [AP]M · subnets: 3 of 3 loaded · hosts: 3 of 3 loaded · services: partial list \\(\\d+-row limit\\)/"
  - region "Services":
    - heading "Services" [level=2]
    - region "Service board":
      - table:
        - rowgroup:
          - row /Service Open issues Measure Last \d+[hmsp]+ Service health/:
            - columnheader "Service"
            - columnheader "Open issues"
            - columnheader "Measure"
            - columnheader /Last \d+[hmsp]+/
            - columnheader "Service health"
        - rowgroup:
          - 'row /DNS none open \d+ queries\/s hourly average, last hour Last \d+ hours: between \d+\.\d+ and \d+\.\d+ queries per second healthy 2\/2 online/':
            - rowheader "DNS":
              - link "DNS":
                - /url: "#dns"
            - cell "none open"
            - cell /\d+ queries\/s hourly average, last hour/
            - 'cell /Last \d+ hours: between \d+\.\d+ and \d+\.\d+ queries per second/':
              - 'img /Last \d+ hours: between \d+\.\d+ and \d+\.\d+ queries per second/'
            - cell "healthy 2/2 online"
          - row "DHCP none open 1 active leases of 2 leases loaded — degraded 1 stopped · 1/2 up":
            - rowheader "DHCP":
              - link "DHCP":
                - /url: "#network?focus=leases"
            - cell "none open"
            - cell "1 active leases of 2 leases loaded"
            - cell "—"
            - cell "degraded 1 stopped · 1/2 up"
          - row /IPAM none open 1 of 3 subnets ≥\d+% 0 more at \d+–\d+% · all subnets — no service state/:
            - rowheader "IPAM":
              - link "IPAM":
                - /url: "#network?minUtil=90"
            - cell "none open"
            - cell /1 of 3 subnets ≥\d+% 0 more at \d+–\d+% · all subnets/
            - cell "—"
            - cell "no service state"
          - 'row "Hosts Critical: 1 of 3 hosts is not online · first seen not trackedAsk the AI: Which hosts are not online? 1 of 3 not online all hosts — no service state"':
            - rowheader "Hosts":
              - link "Hosts":
                - /url: "#infra?status=offline"
            - 'cell "Critical: 1 of 3 hosts is not online · first seen not trackedAsk the AI: Which hosts are not online?"':
              - list:
                - listitem:
                  - text: "Critical:"
                  - link "1 of 3 hosts is not online":
                    - /url: "#infra?status=offline"
                  - text: · first seen not tracked
                  - 'link "Ask the AI: Which hosts are not online?"':
                    - /url: "#ai?q=Which%20hosts%20are%20not%20online%3F"
                    - text: Ask why
            - cell "1 of 3 not online all hosts"
            - cell "—"
            - cell "no service state"
          - 'row "Security Critical: 3 critical or high security events · first seen not trackedAsk the AI: Which domains are on threat feeds? 3 critical or high events whole window — not listed beyond the row cap"':
            - rowheader "Security":
              - link "Security":
                - /url: "#security"
            - 'cell "Critical: 3 critical or high security events · first seen not trackedAsk the AI: Which domains are on threat feeds?"':
              - list:
                - listitem:
                  - text: "Critical:"
                  - link "3 critical or high security events":
                    - /url: "#security"
                  - text: · first seen not tracked
                  - 'link "Ask the AI: Which domains are on threat feeds?"':
                    - /url: "#ai?q=Which%20domains%20are%20on%20threat%20feeds%3F"
                    - text: Ask why
            - cell "3 critical or high events whole window"
            - cell "—"
            - cell "not listed beyond the row cap"
          - 'row "Other Warning, new: 2 subnets close to full · open since Thu, Jan 1 — no service state"':
            - rowheader "Other":
              - link "Other":
                - /url: "#incidents"
            - 'cell "Warning, new: 2 subnets close to full · open since Thu, Jan 1"':
              - list:
                - listitem:
                  - text: "Warning, new:"
                  - link "2 subnets close to full":
                    - /url: "#incidents"
                  - text: · open since Thu, Jan 1
            - cell
            - cell "—"
            - cell "no service state"
  - heading "Charts" [level=2]
  - button "Arrange panels"
  - heading /DNS Query Rate — \d+[hmsp]+/ [level=2]:
    - button /DNS Query Rate — \d+[hmsp]+/
  - text: queries per second
  - 'button /About: DNS Query Rate — \d+[hmsp]+/': "About: ⓘ"
  - 'button /Options: DNS Query Rate — \d+[hmsp]+/'
  - text: /\d+ ▲ \d+\.\d+% vs first hour/
  - application /DNS Query Rate — \d+[hmsp]+ chart/: /\d+:\d+ AM \d+:\d+ AM/
  - heading "License Inventory" [level=2]
  - text: 0 licenses
  - 'button "About: License Inventory"': "About: ⓘ"
  - 'button "Options: License Inventory"'
  - text: no license data available