- main "Overview tab":
  - heading "Overview" [level=1]
  - paragraph:
    - text: Your estate at a glance — DNS load, address use, subnet fullness and host health. On this tab you can open a panel’s ⋯ menu to move it, or drag its right edge to resize, and your arrangement saves automatically.
    - button "Docs →"
  - list "Headline numbers":
    - listitem:
      - button /DNS queries \d+ per sec/
    - listitem:
      - button "Hosts 3"
    - listitem:
      - button "Hosts offline 1"
    - listitem:
      - link /Subnets ≥\d+% 1 0 at \d+–\d+%/:
        - /url: "#network?minUtil=90"
    - listitem:
      - link "Active Leases 1":
        - /url: "#network?focus=leases"
    - listitem:
      - link "Security events 3 critical or high":
        - /url: "#security"
  - button "Arrange panels"
  - heading /DNS Query Rate — \d+[hmsp]+/ [level=2]:
    - button /DNS Query Rate — \d+[hmsp]+/
  - text: avg qps
  - 'button /About: DNS Query Rate — \d+[hmsp]+/': "About: ⓘ"
  - 'button /Options: DNS Query Rate — \d+[hmsp]+/'
  - text: /\d+ ▲ \d+\.\d+% vs first hour/
  - application: /\d+:\d+ AM \d+:\d+ AM/
  - heading "Host Status" [level=2]
  - 'button "About: Host Status"': "About: ⓘ"
  - 'button "Options: Host Status"'
  - application
  - text: 3 hosts
  - button /Degraded \d+%/
  - button /Offline \d+%/
  - button /Other \d+%/
  - list:
    - listitem: baseline-host-c Offline
    - listitem: baseline-host-b Degraded
    - listitem: baseline-host-a Other
  - heading "Top Consumers" [level=2]
  - text: /addresses used · top \d+ of 3 subnets/
  - 'button "About: Top Consumers"': "About: ⓘ"
  - 'button "Options: Top Consumers"'
  - application
  - heading "Subnet Heatmap" [level=2]
  - text: util by subnet — 3 loaded of 3
  - 'button "About: Subnet Heatmap"': "About: ⓘ"
  - 'button "Options: Subnet Heatmap"'
  - group "Subnet utilisation heatmap. Arrow keys move between subnets, Enter opens one.":
    - button /\d+\.\d+\.0\.0 — \d+% used/
    - button /\d+\.\d+\.0\.0 — \d+% used/
    - button /\d+\.\d+\.0\.0 — \d+% used/
  - text: /ok >\d+% >\d+%/
  - heading "Services and incidents" [level=2]
  - link "Incidents":
    - /url: "#incidents"
  - link "Service health":
    - /url: "#infra"
  - 'button "About: Services and incidents"': "About: ⓘ"
  - 'button "Options: Services and incidents"'
  - region "Services and incidents list":
    - list:
      - listitem: DNS 2/2 online healthy
      - listitem: DHCP 1 stopped · 1/2 up degraded
      - listitem: Security beyond the row cap not listed
    - paragraph: "/partial: service inventory truncated at the \\d+-row limit — a service type absent here may exist but not be listed/"
    - list:
      - listitem: high subnets close to full
  - heading "Top Subnets by Utilization" [level=2]
  - text: /excl\. \/\d+–\/\d+ infra links showing 3 of 3/
  - textbox "Filter subnets":
    - /placeholder: Filter…
  - combobox "Site":
    - option "All sites" [selected]
    - option "baseline-site"
    - option "other-site"
  - button "Export CSV"
  - 'button "About: Top Subnets by Utilization"': "About: ⓘ"
  - 'button "Options: Top Subnets by Utilization"'
  - table:
    - rowgroup:
      - row "Network Site Utilization Status Free":
        - columnheader "Network":
          - button "Network"
        - columnheader "Site":
          - button "Site"
        - columnheader "Utilization":
          - button "Utilization"
        - columnheader "Status"
        - columnheader "Free":
          - button "Free"
    - rowgroup:
      - button /View details for \d+\.\d+\.0\.0/:
        - cell /\d+\.\d+\.0\.0/
        - cell "other-site"
        - cell /\d+%/
        - cell "Critical"
        - cell "5 free"
      - button /View details for \d+\.\d+\.0\.0/:
        - cell /\d+\.\d+\.0\.0/
        - cell "baseline-site"
        - cell /\d+%/
        - cell "Warning"
        - cell /\d+ free/
      - button /View details for \d+\.\d+\.0\.0/:
        - cell /\d+\.\d+\.0\.0/
        - cell "baseline-site"
        - cell /\d+%/
        - cell "Healthy"
        - cell /\d+ free/
  - heading "License Inventory" [level=2]
  - text: 0 licenses
  - 'button "About: License Inventory"': "About: ⓘ"
  - 'button "Options: License Inventory"'
  - text: no license data available