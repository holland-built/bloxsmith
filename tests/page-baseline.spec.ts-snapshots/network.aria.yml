- main "Network tab":
  - heading "Network" [level=1]
  - list "Headline numbers":
    - listitem:
      - button "Subnets 3"
    - listitem:
      - button /≥\d+% 1/
    - listitem:
      - button /\d+–\d+% 1/
    - listitem:
      - button "Leases 2"
  - button "Arrange panels"
  - heading "Utilization Distribution" [level=2]
  - text: 3 loaded of 3 total
  - 'button "About: Utilization Distribution"': "About: ⓘ"
  - 'button "Options: Utilization Distribution"'
  - application "Utilization Distribution chart": /<\d+% \d+–\d+% ≥\d+% 0 1 2 3 4/
  - heading "IPAM Spaces — Top Used" [level=2]
  - text: addresses used
  - 'button "About: IPAM Spaces — Top Used"': "About: ⓘ"
  - 'button "Options: IPAM Spaces — Top Used"'
  - link "Baseline Space"
  - text: /\d+/
  - link "Other Space"
  - text: /\d+/
  - heading "Which Subnets Run Out First?" [level=2]
  - text: excl. tiny networks (8 addresses or fewer)
  - textbox "Filter networks":
    - /placeholder: Filter…
  - combobox "Filter by site":
    - option "All sites" [selected]
    - option "baseline-site"
    - option "other-site"
  - 'button "About: Which Subnets Run Out First?"': "About: ⓘ"
  - 'button "Options: Which Subnets Run Out First?"'
  - table:
    - rowgroup:
      - row "Network Site Utilization Status Used Free":
        - columnheader "Network":
          - button "Network"
        - columnheader "Site":
          - button "Site"
        - columnheader "Utilization":
          - button "Utilization"
        - columnheader "Status"
        - columnheader "Used":
          - button "Used"
        - columnheader "Free":
          - button "Free"
    - rowgroup:
      - row /\d+\.\d+\.0\.0\/\d+ \(\d+ addresses\) other-site \d+% Critical \d+ 5 free/:
        - cell /\d+\.\d+\.0\.0\/\d+ \(\d+ addresses\)/
        - cell "other-site"
        - cell /\d+%/
        - cell "Critical"
        - cell /\d+/
        - cell "5 free"
      - row /\d+\.\d+\.0\.0\/\d+ \(\d+ addresses\) baseline-site \d+% Warning \d+ \d+ free/:
        - cell /\d+\.\d+\.0\.0\/\d+ \(\d+ addresses\)/
        - cell "baseline-site"
        - cell /\d+%/
        - cell "Warning"
        - cell /\d+/
        - cell /\d+ free/
      - row /\d+\.\d+\.0\.0\/\d+ \(\d+ addresses\) baseline-site \d+% Healthy \d+ \d+ free/:
        - cell /\d+\.\d+\.0\.0\/\d+ \(\d+ addresses\)/
        - cell "baseline-site"
        - cell /\d+%/
        - cell "Healthy"
        - cell /\d+/
        - cell /\d+ free/
  - heading "DHCP Leases" [level=2]
  - text: 2 of 2
  - textbox "Search address, hostname, MAC":
    - /placeholder: Search address, hostname, MAC…
  - combobox "Filter by state":
    - option "All states" [selected]
    - option "active"
    - option "expired"
  - 'button "About: DHCP Leases"': "About: ⓘ"
  - 'button "Options: DHCP Leases"'
  - table:
    - rowgroup:
      - row "Address Hostname Ends Hardware State":
        - columnheader "Address":
          - button "Address"
        - columnheader "Hostname":
          - button "Hostname"
        - columnheader "Ends":
          - button "Ends"
        - columnheader "Hardware":
          - button "Hardware"
        - columnheader "State":
          - button "State"
    - rowgroup:
      - row /\d+\.\d+\.0\.5 baseline-host-a Jan 1, \d+, 6:\d+ PM \d+:\d+:5e:\d+:\d+:\d+ active/:
        - cell /\d+\.\d+\.0\.5/
        - cell "baseline-host-a"
        - cell /Jan 1, \d+, 6:\d+ PM/
        - cell /\d+:\d+:5e:\d+:\d+:\d+/
        - cell "active"
      - row /\d+\.\d+\.0\.9 baseline-host-b Jan 1, \d+, \d+:\d+ AM \d+:\d+:5e:\d+:\d+:\d+ expired/:
        - cell /\d+\.\d+\.0\.9/
        - cell "baseline-host-b"
        - cell /Jan 1, \d+, \d+:\d+ AM/
        - cell /\d+:\d+:5e:\d+:\d+:\d+/
        - cell "expired"
  - heading "DHCP Requests" [level=2]
  - 'button "About: DHCP Requests"': "About: ⓘ"
  - 'button "Options: DHCP Requests"'
  - text: Today
  - term: Requests for an address
  - definition: /\d+,\d+/
  - term: Requests that got no address
  - definition: /\d+/
  - text: /Last \d+ days/
  - term: Requests for an address
  - definition: /\d+,\d+/
  - term: Requests that got no address
  - definition: not checked
  - paragraph: If your DHCP servers run in HA pairs, both answer each request, so these counts can be up to twice the devices asking.