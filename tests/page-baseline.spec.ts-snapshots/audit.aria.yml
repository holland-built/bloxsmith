- main "Audit tab":
  - heading "Audit" [level=1]
  - region "Can you trust this log": /Audit log Intact \d+ entries checked; none changed or removed How to check it yourself Last entry \d+:\d+ AM Jan \d+, \d+ Couldn't delete a DNS record Couldn't be saved \d+ log entries, since the app started/
  - button "Arrange panels"
  - heading "Audit log" [level=2]
  - text: Bloxsmith actions
  - textbox "Filter audit entries":
    - /placeholder: Filter…
  - combobox "Filter by event":
    - option "All events" [selected]
    - option "Couldn't delete a DNS record"
    - option "Subnet created"
    - option "App updated"
    - option "Change allowed"
    - option "Change blocked (read-only)"
  - text: "5"
  - 'button "About: Audit log"': "About: ⓘ"
  - 'button "Options: Audit log"'
  - table:
    - rowgroup:
      - row "Time Actor Event Detail":
        - columnheader "Time":
          - button "Time"
        - columnheader "Actor":
          - button "Actor"
        - columnheader "Event":
          - button "Event"
        - columnheader "Detail":
          - button "Detail"
    - rowgroup:
      - 'row /1\/1\/\d+, \d+:\d+:\d+ AM baseline-operator Couldn''t delete a DNS record Error: request refused · Item: dns\/record\/baseline-1/':
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Couldn't delete a DNS record"
        - 'cell "Error: request refused · Item: dns/record/baseline-1"'
      - 'row /1\/1\/\d+, \d+:\d+:\d+ AM baseline-operator Change blocked \(read-only\) Tried to create a DNS record; changes are turned off/':
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Change blocked (read-only)"
        - cell "Tried to create a DNS record; changes are turned off"
      - 'row /1\/1\/\d+, 8:\d+:\d+ AM baseline-operator Subnet created Address block: ipam\/address_block\/baseline-1 · Prefix length: \d+ · Subnet: \d+\.\d+\.0\.0/':
        - cell /1\/1\/\d+, 8:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Subnet created"
        - 'cell /Address block: ipam\/address_block\/baseline-1 · Prefix length: \d+ · Subnet: \d+\.\d+\.0\.0/'
      - 'row /1\/1\/\d+, 7:\d+:\d+ AM baseline-operator Change allowed Create a subnet/':
        - cell /1\/1\/\d+, 7:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Change allowed"
        - cell "Create a subnet"
      - 'row /1\/1\/\d+, 6:\d+:\d+ AM baseline-operator App updated From version: v0\.0\.0-baseline/':
        - cell /1\/1\/\d+, 6:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "App updated"
        - 'cell "From version: v0.0.0-baseline"'
  - heading "Activity summary" [level=2]
  - text: 5 recorded events
  - 'button "About: Activity summary"': "About: ⓘ"
  - 'button "Options: Activity summary"'
  - text: Couldn't delete a DNS record 1 Subnet created 1 App updated 1 Change allowed 1 Change blocked (read-only) 1
  - heading "Infoblox Portal audit" [level=2]
  - text: external — Infoblox portal activity
  - textbox "Search user or resource":
    - /placeholder: Search user or resource…
  - button "Search"
  - text: 5 entries shown, total unknown
  - 'button "About: Infoblox Portal audit"': "About: ⓘ"
  - 'button "Options: Infoblox Portal audit"'
  - table:
    - rowgroup:
      - row "Time Who Action Resource Result":
        - columnheader "Time"
        - columnheader "Who"
        - columnheader "Action"
        - columnheader "Resource"
        - columnheader "Result"
    - rowgroup:
      - row /1\/1\/\d+, 6:\d+:\d+ AM actor-alpha \(service\) Changed DNS zone success/:
        - cell /1\/1\/\d+, 6:\d+:\d+ AM/
        - cell "actor-alpha (service)"
        - cell "Changed"
        - cell "DNS zone"
        - cell "success"
      - row /1\/1\/\d+, 7:\d+:\d+ AM actor-beta \(service\) Changed IP address success/:
        - cell /1\/1\/\d+, 7:\d+:\d+ AM/
        - cell "actor-beta (service)"
        - cell "Changed"
        - cell "IP address"
        - cell "success"
      - row /1\/1\/\d+, 8:\d+:\d+ AM actor-alpha \(service\) Deleted DNS record success/:
        - cell /1\/1\/\d+, 8:\d+:\d+ AM/
        - cell "actor-alpha (service)"
        - cell "Deleted"
        - cell "DNS record"
        - cell "success"
      - row /1\/1\/\d+, \d+:\d+:\d+ AM actor-beta \(service\) Changed Subnet success/:
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "actor-beta (service)"
        - cell "Changed"
        - cell "Subnet"
        - cell "success"
      - 'row /1\/1\/\d+, \d+:\d+:\d+ AM actor-gamma \(service\) Changed IP address failed: denied/':
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "actor-gamma (service)"
        - cell "Changed"
        - cell "IP address"
        - 'cell "failed: denied"'