- main "Audit tab":
  - heading "Audit" [level=1]
  - region "Can you trust this log": /Audit log Intact \d+ entries checked; none changed or removed How to check it yourself Last entry \d+:\d+ AM Jan \d+, \d+ Couldn't delete a DNS record Couldn't be saved \d+ log entries, since the app started/
  - button "Arrange panels"
  - heading "Audit log" [level=2]
  - text: Bloxsmith actions
  - textbox "Filter audit entries":
    - /placeholder: Filter…
  - combobox "Filter by event":
    - option "All events" [selected]
    - option "Couldn't delete a DNS record"
    - option "Subnet created"
    - option "App updated"
    - option "Change allowed"
    - option "Change blocked (read-only)"
  - text: "5"
  - 'button "About: Audit log"': "About: ⓘ"
  - 'button "Options: Audit log"'
  - table:
    - rowgroup:
      - row "Time Actor Event Detail":
        - columnheader "Time":
          - button "Time"
        - columnheader "Actor":
          - button "Actor"
        - columnheader "Event":
          - button "Event"
        - columnheader "Detail":
          - button "Detail"
    - rowgroup:
      - 'row /1\/1\/\d+, \d+:\d+:\d+ AM baseline-operator Couldn''t delete a DNS record Error: request refused · Item: DNS record/':
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Couldn't delete a DNS record"
        - 'cell "Error: request refused · Item: DNS record"'
      - 'row /1\/1\/\d+, \d+:\d+:\d+ AM baseline-operator Change blocked \(read-only\) Tried to create a DNS record; changes are turned off/':
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Change blocked (read-only)"
        - cell "Tried to create a DNS record; changes are turned off"
      - 'row /1\/1\/\d+, 8:\d+:\d+ AM baseline-operator Subnet created Subnet: \d+\.\d+\.0\.0\/\d+/':
        - cell /1\/1\/\d+, 8:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Subnet created"
        - 'cell /Subnet: \d+\.\d+\.0\.0\/\d+/'
      - 'row /1\/1\/\d+, 7:\d+:\d+ AM baseline-operator Change allowed Create a subnet/':
        - cell /1\/1\/\d+, 7:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Change allowed"
        - cell "Create a subnet"
      - 'row /1\/1\/\d+, 6:\d+:\d+ AM baseline-operator App updated Was version 0\.0\.0-baseline/':
        - cell /1\/1\/\d+, 6:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "App updated"
        - 'cell "Was version 0.0.0-baseline"'
  - heading "Activity summary" [level=2]
  - text: 5 recorded events
  - 'button "About: Activity summary"': "About: ⓘ"
  - 'button "Options: Activity summary"'
  - text: Couldn't delete a DNS record 1 Subnet created 1 App updated 1 Change allowed 1 Change blocked (read-only) 1
  - heading "Infoblox Portal audit" [level=2]
  - text: From the Infoblox Portal
  - textbox "Search user or resource":
    - /placeholder: Search user or resource…
  - button "Search"
  - text: 5 shown, more not listed
  - 'button "About: Infoblox Portal audit"': "About: ⓘ"
  - 'button "Options: Infoblox Portal audit"'
  - table:
    - rowgroup:
      - row "Time Who Action Resource Result":
        - columnheader "Time"
        - columnheader "Who"
        - columnheader "Action"
        - columnheader "Resource"
        - columnheader "Result"
    - rowgroup:
      - row /1\/1\/\d+, \d+:\d+:\d+ AM actor-gamma \(automated account\) Changed IP address Failed/:
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "actor-gamma (automated account)"
        - cell "Changed"
        - cell "IP address"
        - cell "Failed"
      - row /1\/1\/\d+, \d+:\d+:\d+ AM actor-beta \(automated account\) Changed Subnet Worked/:
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "actor-beta (automated account)"
        - cell "Changed"
        - cell "Subnet"
        - cell "Worked"
      - row /1\/1\/\d+, 8:\d+:\d+ AM actor-alpha \(automated account\) Deleted DNS record Worked/:
        - cell /1\/1\/\d+, 8:\d+:\d+ AM/
        - cell "actor-alpha (automated account)"
        - cell "Deleted"
        - cell "DNS record"
        - cell "Worked"
      - row /1\/1\/\d+, 7:\d+:\d+ AM actor-beta \(automated account\) Changed IP address Worked/:
        - cell /1\/1\/\d+, 7:\d+:\d+ AM/
        - cell "actor-beta (automated account)"
        - cell "Changed"
        - cell "IP address"
        - cell "Worked"
      - row /1\/1\/\d+, 6:\d+:\d+ AM actor-alpha \(automated account\) Changed DNS zone Worked/:
        - cell /1\/1\/\d+, 6:\d+:\d+ AM/
        - cell "actor-alpha (automated account)"
        - cell "Changed"
        - cell "DNS zone"
        - cell "Worked"
