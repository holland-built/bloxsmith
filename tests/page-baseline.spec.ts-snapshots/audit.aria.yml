- main "Audit tab":
  - heading "Audit" [level=1]
  - button "Arrange panels"
  - heading "Audit Log" [level=2]
  - text: Bloxsmith actions
  - textbox "Filter audit entries":
    - /placeholder: Filter…
  - combobox "Filter by event":
    - option "All events" [selected]
    - option "Couldn't delete a DNS record"
    - option "Subnet created"
    - option "App updated"
    - option "Change allowed"
    - option "Change blocked (read-only)"
  - text: "5"
  - 'button "About: Audit Log"': "About: ⓘ"
  - 'button "Options: Audit Log"'
  - text: chain intact — signature and entry count verified · check it yourself with
  - code: bloxsmith audit verify
  - table:
    - rowgroup:
      - row "Time Actor Event Detail":
        - columnheader "Time":
          - button "Time"
        - columnheader "Actor":
          - button "Actor"
        - columnheader "Event":
          - button "Event"
        - columnheader "Detail":
          - button "Detail"
    - rowgroup:
      - row /1\/1\/\d+, \d+:\d+:\d+ AM baseline-operator Couldn't delete a DNS record error=upstream refused · id=dns\/record\/baseline-1/:
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Couldn't delete a DNS record"
        - cell "error=upstream refused · id=dns/record/baseline-1"
      - row /1\/1\/\d+, \d+:\d+:\d+ AM baseline-operator Change blocked \(read-only\) method=POST · path=\/api\/edit\/dnsrecord · reason=tenant-read-only · tenant=baseline\/-/:
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Change blocked (read-only)"
        - cell "method=POST · path=/api/edit/dnsrecord · reason=tenant-read-only · tenant=baseline/-"
      - row /1\/1\/\d+, 8:\d+:\d+ AM baseline-operator Subnet created block=ipam\/address_block\/baseline-1 · cidr=\d+ · subnet=\d+\.\d+\.0\.0/:
        - cell /1\/1\/\d+, 8:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Subnet created"
        - cell /block=ipam\/address_block\/baseline-1 · cidr=\d+ · subnet=\d+\.\d+\.0\.0/
      - row /1\/1\/\d+, 7:\d+:\d+ AM baseline-operator Change allowed method=POST · path=\/api\/provision\/subnet/:
        - cell /1\/1\/\d+, 7:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "Change allowed"
        - cell "method=POST · path=/api/provision/subnet"
      - row /1\/1\/\d+, 6:\d+:\d+ AM baseline-operator App updated from=v0\.0\.0-baseline/:
        - cell /1\/1\/\d+, 6:\d+:\d+ AM/
        - cell "baseline-operator"
        - cell "App updated"
        - cell "from=v0.0.0-baseline"
  - heading "Activity Summary" [level=2]
  - text: 5 recorded events
  - 'button "About: Activity Summary"': "About: ⓘ"
  - 'button "Options: Activity Summary"'
  - text: Couldn't delete a DNS record 1 Subnet created 1 App updated 1 Change allowed 1 Change blocked (read-only) 1
  - heading "CSP Portal Audit" [level=2]
  - text: external — Infoblox portal activity
  - textbox "Search user or resource":
    - /placeholder: Search user or resource…
  - button "Search"
  - text: 5 entries shown, total unknown
  - 'button "About: CSP Portal Audit"': "About: ⓘ"
  - 'button "Options: CSP Portal Audit"'
  - table:
    - rowgroup:
      - row "Time Who Action Resource Result":
        - columnheader "Time"
        - columnheader "Who"
        - columnheader "Action"
        - columnheader "Resource"
        - columnheader "Result"
    - rowgroup:
      - row /1\/1\/\d+, 6:\d+:\d+ AM actor-alpha \(service\) UPDATE auth_zone success/:
        - cell /1\/1\/\d+, 6:\d+:\d+ AM/
        - cell "actor-alpha (service)"
        - cell "UPDATE"
        - cell "auth_zone"
        - cell "success"
      - row /1\/1\/\d+, 7:\d+:\d+ AM actor-beta \(service\) UPDATE addressservice success/:
        - cell /1\/1\/\d+, 7:\d+:\d+ AM/
        - cell "actor-beta (service)"
        - cell "UPDATE"
        - cell "addressservice"
        - cell "success"
      - row /1\/1\/\d+, 8:\d+:\d+ AM actor-alpha \(service\) DELETE dnsrecord success/:
        - cell /1\/1\/\d+, 8:\d+:\d+ AM/
        - cell "actor-alpha (service)"
        - cell "DELETE"
        - cell "dnsrecord"
        - cell "success"
      - row /1\/1\/\d+, \d+:\d+:\d+ AM actor-beta \(service\) UPDATE subnetservice success/:
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "actor-beta (service)"
        - cell "UPDATE"
        - cell "subnetservice"
        - cell "success"
      - 'row /1\/1\/\d+, \d+:\d+:\d+ AM actor-gamma \(service\) UPDATE addressservice failed: denied/':
        - cell /1\/1\/\d+, \d+:\d+:\d+ AM/
        - cell "actor-gamma (service)"
        - cell "UPDATE"
        - cell "addressservice"
        - 'cell "failed: denied"'