- main "Incidents tab":
  - heading "Incidents" [level=1]
  - text: /Updated \d+:\d+ PM/
  - button "Arrange panels"
  - button "About incidents-severity": ⓘ
  - button "Options for Severity Counts": ⋯
  - group "Incidents by severity":
    - button "Critical 1 of 2"
    - button "High 0 of 2" [disabled]
    - button "Medium 1 of 2"
    - button "Low 0 of 2" [disabled]
  - heading "Categories" [level=2]
  - 'button "About: Categories"': "About: ⓘ"
  - 'button "Options: Categories"'
  - 'button "2 Capacity · worst: high"'
  - heading "Triage" [level=2]
  - textbox "Filter incidents":
    - /placeholder: Filter…
  - button "Clear acks"
  - text: "2"
  - 'button "About: Triage"': "About: ⓘ"
  - 'button "Options: Triage"'
  - table:
    - rowgroup:
      - row "Ack Category What Severity Message Age":
        - columnheader "Ack"
        - columnheader "Category":
          - button "Category"
        - columnheader "What":
          - button "What"
        - columnheader "Severity":
          - button "Severity"
        - columnheader "Message"
        - columnheader "Age":
          - button "Age"
    - rowgroup:
      - row /Acknowledge signal Capacity ipam\/subnet\/baseline-3 Critical baseline-net-c is \d+% used \d+[hmsp]+/:
        - cell "Acknowledge signal":
          - checkbox "Acknowledge signal"
        - cell "Capacity"
        - cell "ipam/subnet/baseline-3"
        - cell "Critical"
        - cell /baseline-net-c is \d+% used/
        - cell /\d+[hmsp]+/
      - row /Acknowledge signal DNS dns\/auth_zone\/baseline-2 Medium other\.example is unsigned \d+[hmsp]+/:
        - cell "Acknowledge signal":
          - checkbox "Acknowledge signal"
        - cell "DNS"
        - cell "dns/auth_zone/baseline-2"
        - cell "Medium"
        - cell "other.example is unsigned"
        - cell /\d+[hmsp]+/
  - heading "IQ Actions" [level=2]
  - text: IQ for Threat Defense 1 open · 1 resolved
  - 'button "About: IQ Actions"': "About: ⓘ"
  - 'button "Options: IQ Actions"'
  - table:
    - rowgroup:
      - row "Sev Action Status":
        - columnheader "Sev":
          - button "Sev"
        - columnheader "Action"
        - columnheader "Status"
    - rowgroup:
      - row "High Baseline suspicious domain Open Resolve":
        - cell "High"
        - cell "Baseline suspicious domain":
          - button "Baseline suspicious domain"
        - cell "Open Resolve":
          - text: Open
          - button "Resolve"
      - row "Low Baseline resolved lookup Resolved Reopen":
        - cell "Low"
        - cell "Baseline resolved lookup":
          - button "Baseline resolved lookup"
        - cell "Resolved Reopen":
          - text: Resolved
          - button "Reopen"
  - heading "Action Volume" [level=2]
  - text: by day
  - 'button "About: Action Volume"': "About: ⓘ"
  - 'button "Options: Action Volume"'
  - application "Action Volume chart": /Dec \d+ Jan 1/
  - text: High 1 Medium 0 Low 1