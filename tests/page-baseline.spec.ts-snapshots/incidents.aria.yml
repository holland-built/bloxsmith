- main "Incidents tab":
  - heading "Incidents" [level=1]
  - text: /Updated \d+:\d+ PM/
  - button "Arrange panels"
  - button "About incidents-severity": ⓘ
  - button "Options for Severity Counts": ⋯
  - group "Incidents by severity":
    - button "Critical 1 of 2"
    - button "High 0 of 2" [disabled]
    - button "Medium 1 of 2"
    - button "Low 0 of 2" [disabled]
  - heading "Categories" [level=2]
  - 'button "About: Categories"': "About: ⓘ"
  - 'button "Options: Categories"'
  - button "1 Capacity · 1 critical"
  - button "1 DNS · 1 medium"
  - heading "Triage" [level=2]
  - textbox "Filter incidents":
    - /placeholder: Filter…
  - button "Clear seen marks"
  - text: "2"
  - 'button "About: Triage"': "About: ⓘ"
  - 'button "Options: Triage"'
  - table:
    - rowgroup:
      - row "Seen Category What Severity Message Age":
        - columnheader "Seen"
        - columnheader "Category":
          - button "Category"
        - columnheader "What":
          - button "What"
        - columnheader "Severity":
          - button "Severity"
        - columnheader "Message"
        - columnheader "Age":
          - button "Age"
    - rowgroup:
      - row /Mark baseline-net-c as seen Capacity baseline-net-c Critical baseline-net-c is \d+% full \d+[hmsp]+/:
        - cell "Mark baseline-net-c as seen":
          - checkbox "Mark baseline-net-c as seen"
        - cell "Capacity"
        - cell "baseline-net-c":
          - link "baseline-net-c":
            - /url: "#dossier?kind=network&q=baseline-net-c&id=ipam%2Fsubnet%2Fbaseline-3"
        - cell "Critical"
        - cell /baseline-net-c is \d+% full/
        - cell /\d+[hmsp]+/
      - 'row /Mark other\.example\. as seen DNS other\.example\. Medium other\.example\.: cache time too short \d+[hmsp]+/':
        - cell "Mark other.example. as seen":
          - checkbox "Mark other.example. as seen"
        - cell "DNS"
        - cell "other.example.":
          - link "other.example.":
            - /url: "#dossier?kind=zone&q=other.example.&id=dns%2Fauth_zone%2Fbaseline-2"
        - cell "Medium"
        - 'cell "other.example.: cache time too short"'
        - cell /\d+[hmsp]+/
  - heading "Suggested actions" [level=2]
  - text: From Infoblox threat insights 1 open · 1 resolved
  - 'button "About: Suggested actions"': "About: ⓘ"
  - 'button "Options: Suggested actions"'
  - table:
    - rowgroup:
      - row "Severity Action Status":
        - columnheader "Severity":
          - button "Severity"
        - columnheader "Action"
        - columnheader "Status"
    - rowgroup:
      - row "High Baseline suspicious domain Open Resolve":
        - cell "High"
        - cell "Baseline suspicious domain":
          - button "Baseline suspicious domain"
        - cell "Open Resolve":
          - text: Open
          - button "Resolve"
      - row "Low Baseline resolved lookup Resolved Reopen":
        - cell "Low"
        - cell "Baseline resolved lookup":
          - button "Baseline resolved lookup"
        - cell "Resolved Reopen":
          - text: Resolved
          - button "Reopen"
  - heading "Action volume" [level=2]
  - text: by day
  - 'button "About: Action volume"': "About: ⓘ"
  - 'button "Options: Action volume"'
  - application "Action volume chart": /Dec \d+ Jan 1/
  - text: High 1 Medium 0 Low 1